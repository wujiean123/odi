<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ODI·TSK-11 评分台</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ODI评分台">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: printed-form logic. Cards are the paper sheets, answer bubbles are scantron-style fills,
   a sticky score rail sits beside the form (bottom bar on phones). One accent, used only for what is chosen. */
:root{
  --paper:#EDF0F3; --sheet:#FFFFFF; --ink:#101A23; --muted:#55626E; --rule:#D2D9E0;
  --accent:#2A3FD1; --on-accent:#FFFFFF; --tint:#E7EAFB; --warn:#A6480F; --ok:#1C7A4B;
  --cjk:"Noto Sans SC","PingFang SC","Microsoft YaHei";
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#0D1218;--sheet:#151C24;--ink:#E6EBF0;--muted:#93A0AC;--rule:#28313B;--accent:#8E9CFF;--on-accent:#0D1218;--tint:#1E2540;--warn:#F0A36B;--ok:#67D39B;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#0D1218;--sheet:#151C24;--ink:#E6EBF0;--muted:#93A0AC;--rule:#28313B;--accent:#8E9CFF;--on-accent:#0D1218;--tint:#1E2540;--warn:#F0A36B;--ok:#67D39B;color-scheme:dark}
:lang(zh-Hant){--cjk:"Noto Sans TC","PingFang TC","Microsoft JhengHei"}

*{box-sizing:border-box;font-family:"IBM Plex Sans",var(--cjk),system-ui,sans-serif}
.display,.display *{font-family:"Bricolage Grotesque",var(--cjk),system-ui,sans-serif}
.mono,.mono *{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
body{background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}

/* language switching */
html[data-lang="zh"] .en{display:none}
html[data-lang="en"] .zh{display:none}
.bi .zh,.bi .en{display:block}
html[data-lang="both"] .en{color:var(--muted);font-size:.88em}
html[data-lang="both"] .bi-i .en{margin-left:.45em}
html[data-lang="both"] .tab .en,html[data-lang="both"] th .en{margin-left:0}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:space-between;align-items:flex-end;padding-block:24px 16px}
.brand{min-width:0}
h1{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin-top:6px;font-size:14px;max-width:60ch}
.ctrl{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 14px;min-height:38px;cursor:pointer;font-weight:500}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw .track{width:38px;height:22px;border:2px solid var(--ink);border-radius:12px;position:relative;flex:none;transition:background .15s}
.sw .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink);transition:transform .15s,background .15s}
.sw input:checked + .track{background:var(--accent);border-color:var(--accent)}
.sw input:checked + .track::after{transform:translateX(16px);background:var(--on-accent)}
.sw input:focus-visible + .track{outline:3px solid var(--accent);outline-offset:2px}

/* tabs */
.tabsbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);border-bottom:1px solid var(--ink);display:flex;gap:16px;justify-content:space-between;align-items:flex-end}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0}
.tab{border:0;background:transparent;cursor:pointer;padding:10px 14px 8px;border-bottom:4px solid transparent;text-align:left;display:flex;gap:8px;align-items:flex-start;white-space:nowrap}
.tab[aria-selected="true"]{border-bottom-color:var(--accent);font-weight:600}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.tab .cnt{font-size:12px;color:var(--muted);border:1px solid var(--rule);border-radius:3px;padding:0 5px;line-height:18px;margin-top:2px}
.tab .cnt.full{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.tab .bi{line-height:1.25}
.tab .en{font-size:11px}
.ctx{font-size:13px;color:var(--muted);padding-bottom:10px;white-space:nowrap}
.ctx b{color:var(--ink);font-weight:500}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding-block:24px 96px;align-items:start}
.aside{display:none}
@media (min-width:960px){
  .layout{grid-template-columns:minmax(0,1fr) 320px;padding-bottom:48px}
  .aside{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
  .bar{display:none!important}
}

/* generic card */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;margin-bottom:16px}
.card-h{padding:14px 16px;border-bottom:1px solid var(--ink)}
.card-h h2,.card-h h3{font-size:18px;font-weight:600;line-height:1.3}
.card-b{padding:16px}
.note{color:var(--muted);font-size:13.5px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;padding:16px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label{font-size:13px;font-weight:500}
.fld input,.fld select{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--ink);border-radius:4px;background:var(--paper);font-size:16px}
.fld input.mono{font-family:"IBM Plex Mono",monospace}
.fld input:focus-visible,.fld select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.fld .hint{font-size:12.5px;color:var(--muted)}
.fld .err{font-size:12.5px;color:var(--warn)}
#fId{text-transform:uppercase}
.keynote{padding:0 16px 16px;font-size:13.5px}
.keynote .warn{color:var(--warn)}
.keynote .ok{color:var(--ok)}
.btn{min-height:44px;padding:0 18px;border-radius:4px;border:1px solid var(--ink);background:transparent;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--tint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{min-height:34px;padding:0 12px;font-size:13.5px}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.armed{border-color:var(--warn)!important;color:var(--warn)!important}

/* instruction strip */
.intro{padding:14px 16px;background:var(--tint);border-radius:6px;margin-bottom:16px;font-size:14.5px}

/* ODI sections */
.sec{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;margin-bottom:16px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ink);flex-wrap:wrap}
.sec-h h3{font-size:18px;font-weight:600;line-height:1.3;flex:1 1 200px;min-width:0}
.sec-n{display:inline-grid;place-items:center;min-width:38px;height:26px;padding:0 6px;border:1px solid var(--ink);border-radius:3px;font-size:12.5px;flex:none}
.done .sec-n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.na{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer;min-height:36px}
.na input{width:20px;height:20px;accent-color:var(--accent)}
.opt{display:grid;grid-template-columns:26px minmax(0,1fr);gap:14px;align-items:start;padding:11px 16px;min-height:48px;border-top:1px solid var(--rule);cursor:pointer;position:relative}
.opt:first-child{border-top:0}
.opt:hover{background:color-mix(in srgb,var(--tint) 55%,var(--sheet))}
.opt input,.sc input{position:absolute;opacity:0;pointer-events:none}
.bub{width:24px;height:24px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:var(--sheet);margin-top:1px;flex:none}
.opt:has(input:checked){background:var(--tint)}
.opt input:checked + .bub{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--tint)}
.opt input:focus-visible + .bub,.sc input:focus-visible + .bub{outline:3px solid var(--accent);outline-offset:2px}
.opt .txt{font-size:15.5px;line-height:1.45}
.sec.off .opt{opacity:.4;cursor:not-allowed}

/* TSK items */
.q{padding:16px;border-top:1px solid var(--rule)}
.q:first-child{border-top:0}
.q-t{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:start;font-size:16px}
.q .sec-n{min-width:30px}
.q.done .sec-n{background:var(--accent)}
.scale{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px;margin-left:48px}
.sc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border:1px solid var(--rule);border-radius:4px;cursor:pointer;text-align:center;font-size:12.5px;line-height:1.3;position:relative;min-height:76px}
.sc:hover{background:color-mix(in srgb,var(--tint) 55%,var(--sheet))}
.sc:has(input:checked){border-color:var(--accent);background:var(--tint)}
.sc .bub{width:30px;height:30px;font-size:14px;font-weight:500}
.sc input:checked + .bub{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sc .bi .zh,.sc .bi .en{display:block}
html[data-lang="both"] .sc .en{font-size:11px}
@media (max-width:620px){.scale{margin-left:0}.q-t{grid-template-columns:34px minmax(0,1fr)}}

/* result cards */
.res{background:var(--sheet);border:1px solid var(--ink);border-radius:6px;margin-bottom:16px}
.res-b{padding:18px 16px 16px}
.res-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.big{font-size:60px;line-height:1;font-weight:700;letter-spacing:-.02em}
.big small{font-size:24px;font-weight:600;color:var(--muted);margin-left:4px}
.band{font-size:18px;font-weight:600}
.meta{color:var(--muted);font-size:13.5px;margin-top:10px}
.meter{position:relative;margin-top:22px}
.segs{display:flex;height:12px;border-radius:2px;overflow:hidden;gap:2px}
.segs i{flex:1;display:block}
.m1{background:color-mix(in srgb,var(--accent) 16%,var(--sheet))}
.m2{background:color-mix(in srgb,var(--accent) 36%,var(--sheet))}
.m3{background:color-mix(in srgb,var(--accent) 56%,var(--sheet))}
.m4{background:color-mix(in srgb,var(--accent) 78%,var(--sheet))}
.m5{background:var(--accent)}
.pin{position:absolute;top:-10px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--ink);transform:translateX(-50%)}
.pinline{position:absolute;top:0;width:2px;height:12px;background:var(--ink);transform:translateX(-50%)}
.ticks{position:relative;height:18px;margin-top:4px;font-size:11.5px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span.l{transform:none}
.ticks span.r{transform:translateX(-100%)}
.dims{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px}
.dims td{padding:7px 0;border-top:1px solid var(--rule)}
.dims td:last-child{text-align:right}
details.bands{margin-top:14px;font-size:13.5px}
details.bands summary{cursor:pointer;color:var(--muted);min-height:32px;display:flex;align-items:center}
details.bands summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bandlist{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:6px}
.bandlist .mono{color:var(--muted)}
.blindmsg{padding:20px 16px;color:var(--muted)}

/* aside + bar */
.asd{background:var(--sheet);border:1px solid var(--ink);border-radius:6px}
.asd-h{padding:12px 16px;border-bottom:1px solid var(--ink);font-weight:600}
.asd-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 16px;border-top:1px solid var(--rule)}
.asd-row:first-of-type{border-top:0}
.asd-row .lab{font-size:13px;color:var(--muted)}
.asd-row .v{font-size:30px;font-weight:700;line-height:1.1;text-align:right}
.asd-row .v small{font-size:14px;color:var(--muted);font-weight:500}
.asd-row .st{font-size:12.5px;color:var(--muted);text-align:right}
.asd-f{padding:14px 16px 16px;border-top:1px solid var(--ink);display:flex;flex-direction:column;gap:10px}
.asd-f .btn{width:100%}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--sheet);border-top:1px solid var(--ink);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar-s{display:flex;gap:18px;align-items:baseline;min-width:0;flex-wrap:wrap}
.bar-s div{display:flex;gap:6px;align-items:baseline}
.bar-s .lab{font-size:12px;color:var(--muted)}
.bar-s .v{font-size:22px;font-weight:700}
.bar .btn{flex:none}

/* records */
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--sheet)}
table.rec{border-collapse:collapse;width:100%;min-width:880px}
.rec th{text-align:left;font-size:12.5px;font-weight:500;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--ink);white-space:nowrap;vertical-align:bottom}
.rec td{padding:10px 12px;border-top:1px solid var(--rule);white-space:nowrap;font-variant-numeric:tabular-nums}
.rec tbody tr:first-child td{border-top:0}
.rec td.num{font-family:"IBM Plex Mono",monospace}
.rec .warn{color:var(--warn);font-size:12.5px}
.rec .empty{padding:28px 12px;color:var(--muted);white-space:normal;text-align:center}
.rec td.act{display:flex;gap:6px}
.copybox{width:100%;min-height:120px;margin-top:12px;padding:10px;border:1px solid var(--ink);border-radius:4px;background:var(--paper);font:13px/1.4 "IBM Plex Mono",monospace}
.warnbox{padding:12px 16px;border:1px solid var(--warn);border-radius:6px;color:var(--warn);margin-bottom:16px;font-size:14px}
.rulebox{padding:14px 16px;border-left:4px solid var(--ink);background:var(--sheet);margin-bottom:16px;font-size:14px}
.nav{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.foot{padding-block:8px 40px;font-size:12.5px;color:var(--muted);max-width:90ch}
.foot p+p{margin-top:4px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:4px;max-width:calc(100% - 32px);font-size:14px}
.toast .en{color:inherit!important;opacity:.8}
@media (min-width:960px){.toast{bottom:28px}}
@media (max-width:480px){h1{font-size:25px}.big{font-size:48px}}
[hidden]{display:none!important}
@media (max-width:700px){.ctx{display:none}}
/* share dialog */
.ovl{position:fixed;inset:0;z-index:30;background:rgba(8,12,18,.6);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--sheet);border:1px solid var(--ink);border-radius:6px;width:100%;max-width:480px;max-height:100%;overflow:auto}
.dlg .card-b{display:flex;flex-direction:column;gap:14px}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#qr{width:168px;height:168px;border:1px solid var(--rule);flex:none;background:#fff;display:grid;place-items:center;font-size:12px;color:#55626E;text-align:center;padding:6px}
#qr svg{display:block;width:100%;height:100%}
/* emg */
.drop{position:relative;display:grid;gap:6px;padding:22px 16px;border:2px dashed var(--ink);border-radius:6px;background:var(--paper);cursor:pointer}
.drop:hover{background:var(--tint);border-color:var(--accent)}
.drop:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.drop-t{font-size:17px;font-weight:600}
.plot{border:1px solid var(--rule);border-radius:6px;background:var(--sheet);overflow:hidden;margin:12px 16px 0}
.plot canvas{display:block;width:100%;touch-action:pan-y}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);padding:10px 12px;border-top:1px solid var(--rule)}
.lg{display:inline-flex;gap:6px;align-items:center}
.lg i{display:inline-block;width:18px;height:4px}
.lg .g{background:var(--muted);opacity:.6;height:10px}
.lg .a{background:var(--accent);height:3px}
.lg .w{background:var(--accent);opacity:.2;height:10px}
.lg .n{background:var(--ink)}
.lg .d{background:var(--accent);height:4px}
.frrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px 32px}
.frr-box .lab{font-size:13px;color:var(--muted);margin-bottom:4px}
.big.s{font-size:48px}
.warnlist{margin:14px 0 0;padding-left:18px;color:var(--warn);font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.method{font-size:13.5px;color:var(--muted);margin-top:12px;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* VAS ruler, session log, data safety */
.toast{z-index:40}
.vq{font-size:18px;font-weight:600;line-height:1.45;margin-bottom:14px;text-wrap:balance}
.vr{width:100%;overflow:hidden;padding:0 20px}
.vr-in{margin:0 auto;position:relative}
.vr-zone{position:relative;height:80px}
.vr-line{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:var(--ink)}
.vr-stop{position:absolute;top:50%;width:3px;height:40px;margin-top:-20px;background:var(--ink)}
.vr-stop.l{left:-1.5px}
.vr-stop.r{right:-1.5px}
.vr-mark{position:absolute;top:50%;width:3px;height:64px;margin:-32px 0 0 -1.5px;background:var(--accent);border-radius:1px;box-shadow:0 0 0 2px var(--sheet)}
.vr-hit{position:absolute;top:0;bottom:0;left:-20px;right:-20px;touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:4px}
.vr-hit:focus-visible{outline:3px solid var(--accent);outline-offset:-2px}
.vr-anch{display:flex;justify-content:space-between;gap:16px;margin-top:2px;font-size:13.5px;font-weight:500}
.vr-anch .a{max-width:48%}
.vr-anch .a.r{text-align:right}
.rstat{margin:10px 0 16px;font-size:13px}
.rstat .warn{color:var(--warn)}
.rstat .ok{color:var(--ok)}
.stepper{display:flex;gap:6px}
.stepper input{flex:1;min-width:0;text-align:center}
.stepper .btn{padding:0;width:44px;font-size:20px;flex:none}
.fld>.fl{font-size:13px;font-weight:500}
.bak{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);margin-bottom:16px;font-size:14px}
.bak.warn{border-color:var(--warn);color:var(--warn)}
.bak.ok{color:var(--ok)}
.bak .btn{color:var(--ink)}
.safe{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px;font-size:14px;margin-bottom:16px}
.safe .k{color:var(--muted)}
.safe .ok{color:var(--ok)}
.safe .warn{color:var(--warn)}

.tag{display:inline-block;font-size:11.5px;border:1px solid var(--rule);border-radius:3px;padding:0 5px;margin-left:6px;color:var(--muted);font-weight:400}

.rec tr.void td{opacity:.55}

.calwrap{padding:14px 0;overflow:hidden}

.calbar::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--ink)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--rule);stroke-width:1}
.chart .tx{fill:var(--muted);font-size:12px;font-family:"IBM Plex Mono",monospace}
.chart .ln{fill:none;stroke-width:2}
.chart .ln.post{stroke:var(--accent)}
.chart .ln.pre{stroke:var(--muted);stroke-dasharray:5 4}
.pt.post{fill:var(--accent);stroke:var(--accent);stroke-width:2}
.pt.pre{fill:var(--sheet);stroke:var(--muted);stroke-width:2}
#sChart .legend{border-top:0;padding-left:0}
#sId{text-transform:uppercase}
.dlg.wide{max-width:720px}
.dlg .tablewrap{margin:0}
.dlg table.rec{min-width:520px}
.dlg p{margin:0}
.btn.primary .en{color:inherit;opacity:.88}
.fld .seg{width:100%}

html[data-tab="ses"] .aside,html[data-tab="ses"] .bar{display:none!important}

/* participants, randomization, simplified assessment */
.chk{display:flex;gap:12px;align-items:center;min-height:48px;cursor:pointer;font-size:16px;font-weight:500}
.chk input{width:26px;height:26px;accent-color:var(--accent);flex:none}
.who{padding:10px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);margin-bottom:16px;font-size:15px}
.armtag{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 7px;border:2px solid var(--accent);border-radius:4px;font-weight:700;font-size:13px;color:var(--accent);font-family:"IBM Plex Mono",monospace;vertical-align:middle}
.armtag.lg{min-width:84px;height:84px;font-size:52px;border-width:4px;border-radius:12px}
.armbig{display:flex;gap:18px;align-items:center;margin:14px 0}
.armbig-t{font-size:28px;font-weight:700}
.prog{height:12px;border:1px solid var(--ink);border-radius:3px;overflow:hidden;background:var(--paper)}
.prog i{display:block;height:100%;background:var(--accent)}
.pstats{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:12px}
.pst{display:flex;flex-direction:column}
.pst .k{font-size:12.5px;color:var(--muted)}
.pst b{font-size:24px;line-height:1.2}
.pst.warn b{color:var(--warn)}
.mut{color:var(--muted)}
#sTable td,#sTable th,#parTable td,#parTable th{padding-left:8px;padding-right:8px}
.rec td.act{gap:4px;flex-wrap:nowrap}
.rec td.act .btn.small{padding:0 9px}
.pnote{margin-top:12px;font-size:13.5px;color:var(--warn)}
.rsum{display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.rsum .sm{font-size:12.5px;color:var(--muted);word-break:break-all}
.rsum .warn{color:var(--warn)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn.danger:hover{background:color-mix(in srgb,var(--warn) 12%,var(--sheet))}
.mlist{margin:0 0 4px;padding-left:20px}
.vread{font-size:15px}
.vasrow{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
html[data-lang="both"] .tag .en{margin-left:.35em}
html[data-lang="both"] .pst .k .en{margin-left:.35em}
#sId{text-transform:none}
html[data-lang="en"] .sc .bi .zh,html[data-lang="zh"] .sc .bi .en{display:none}
html[data-tab="par"] .aside,html[data-tab="par"] .bar,html[data-tab="rec"] .aside,html[data-tab="rec"] .bar{display:none!important}
html[data-tab="par"] .layout,html[data-tab="rec"] .layout{grid-template-columns:minmax(0,1fr)}
@media (max-width:620px){.vq{font-size:17px}}

/* McGill core endurance tests */
.mtests{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:14px}
.mt{border:1px solid var(--rule);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--paper);min-width:0}
.mt.run{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.mt-h b{font-size:16px;line-height:1.35}

.mt.run .mt-t{color:var(--accent)}
.mt .btn-row{flex-wrap:nowrap}
.mt .btn.go{flex:1;min-height:56px;font-size:17px}
.mt .bands{margin-top:0}
.mt-d{font-size:13px;color:var(--muted);line-height:1.55;margin-top:6px}
.fld input:disabled{opacity:.6}
.rec.stat{min-width:560px}
.stat-h{margin:0 0 6px;font-size:14.5px}
.rec td.flag{color:var(--warn);font-weight:600}
html[data-tab="mcg"] .aside,html[data-tab="mcg"] .bar{display:none!important}
html[data-tab="mcg"] .layout{grid-template-columns:minmax(0,1fr)}

/* patient mode: only the three questionnaires (and the post-treatment VAS) remain */
.h-pt{display:none}
html[data-blind="1"] .h-pt{display:block}
html[data-blind="1"] .h-staff,html[data-blind="1"] .staffonly,html[data-blind="1"] #storeWarn,html[data-blind="1"] .aside,html[data-blind="1"] .bar,html[data-blind="1"] .ctx,
html[data-blind="1"] #t-par,html[data-blind="1"] #t-ses,html[data-blind="1"] #t-mcg,html[data-blind="1"] #t-emg,html[data-blind="1"] #t-rec,
html[data-blind="1"] #odiResult,html[data-blind="1"] #tskResult,html[data-blind="1"] .rstat{display:none!important}
html[data-blind="1"][data-tab="ses"] .tabsbar,html[data-blind="1"][data-tab="wait"] .tabsbar{display:none}

.ptwait{text-align:center;padding:56px 16px}

#mTable td,#mTable th{padding-left:8px;padding-right:8px}

/* third-party randomisation: no group columns anywhere */
html[data-rmode="ext"] #recTable tr>:nth-child(2),html[data-rmode="ext"] #sTable tr>:nth-child(2),html[data-rmode="ext"] #mTable tr>:nth-child(2){display:none}

.cloud{font-size:13px;max-width:280px;line-height:1.35}
.cloud .ok,#cloudStat .ok{color:var(--ok)}

html[data-lang="both"] .cloud .en{display:block;margin-left:0}

          <details class="bands" style="padding:4px 16px">
            <summary class="bi-i" data-t="测试流程与分析段（点开查看）|Test procedure and analysis segments (tap to open)"></summary>
            <div class="method bi" style="margin-bottom:12px" data-t="<b>测试流程（4-4-4-4 节奏）</b><br>1. 备皮、磨砂、酒精擦拭，按 SENIAM 在双侧竖脊肌贴电极（文献用过 L1、L2–L3、L1–L2 加 L4–L5 等位置），并在皮肤上做标记。前后测必须用同一位置。<br>2. 直立，膝伸直，双臂自然下垂，目视前方。脚间距和手臂位置各文献没有统一，请固定并记录。<br>3. 用提示音或口令统一节奏，一个循环 16 秒：站立 4 秒，慢慢前屈到最深 4 秒，在最深处放松保持不动 4 秒，慢慢起身 4 秒。Gouteron 2024 和 Peharec 2024 都用每个动作 4 秒。<br>4. 先练习 1 到 3 次，再连续做 3 个循环，记录成一个文件，从第一声提示音开始记录。文献里的正式次数有 1、3、5 次，哪种最可靠尚无定论。保持期不要晃动、抬头或发力。<br><b>口令卡</b>：0–4 秒“站直”；4–8 秒“慢慢弯下去”；8–12 秒“放松，不要动”；12–16 秒“慢慢起来”。<br><b>分析哪一段</b><br>站立（不用）→ 前屈（<b>分子</b>取这里最用力的 1 秒）→ 全屈曲保持（<b>分母</b>取这里最安静的 1 秒，两端各去掉 1 秒过渡）→ 起身（不用）。下面的“节奏模式”就按这个时间表直接定位。|<b>Procedure (4-4-4-4 rhythm)</b><br>1. Shave, abrade and clean the skin, place electrodes over both erector spinae following SENIAM (published studies used L1, L2–L3, or L1–L2 plus L4–L5) and mark the skin. Use the same position at every timepoint.<br>2. Stand upright, knees straight, arms hanging, eyes forward. Foot spacing and arm position are not standardised across studies, so fix and record them.<br>3. Pace the movement with a tone or verbal cue. One cycle is 16 s: stand 4 s, bend slowly to the deepest point 4 s, relax and hold still at the bottom 4 s, return slowly 4 s. Gouteron 2024 and Peharec 2024 both used 4 s per phase.<br>4. Practise 1 to 3 times, then do 3 consecutive cycles recorded in one file, starting the recording at the first cue. Published studies used 1, 3 or 5 formal trials; no number is established as most reliable. Stay still during the hold; do not sway, lift the head or push.<br><b>Cue card</b>: 0–4 s Stand tall; 4–8 s Bend down slowly; 8–12 s Relax, do not move; 12–16 s Come up slowly.<br><b>Which segment to analyse</b><br>Standing (not used) → flexion (<b>numerator</b>: the busiest 1 s here) → full-flexion hold (<b>denominator</b>: the quietest 1 s here, with 1 s of transition removed at each end) → return (not used). The Timed protocol mode below locates these segments from this schedule."></div>
          </details>
        </div>

          </div>
          <details class="bands" style="padding:0 16px 16px">
            <summary class="bi-i" data-t="更多设置与计算方法|More settings and method"></summary>
            <div class="fields" style="padding:12px 0 0">
              <div class="fld"><label for="emgW" class="bi-i" data-t="计算窗口（秒，分子分母通用）|Window length (s, both parts)"></label><input id="emgW" class="mono" type="number" inputmode="decimal" min="0.1" max="10" step="0.1"></div>
              <div class="fld"><label for="emgA" class="bi-i" data-t="分析起点（秒）|Analysis start (s)"></label><input id="emgA" class="mono" type="number" inputmode="decimal" min="0" step="0.1"></div>
              <div class="fld"><label for="emgB" class="bi-i" data-t="分析终点（秒）|Analysis end (s)"></label><input id="emgB" class="mono" type="number" inputmode="decimal" min="0" step="0.1"></div>
              <div class="fld"><label class="sw"><input type="checkbox" id="emgHp"><span class="track"></span><span class="bi-i" data-t="20 Hz 高通滤波|20 Hz high-pass"></span></label></div>
              <div class="fld"><label class="sw"><input type="checkbox" id="emgNotch"><span class="track"></span><span class="bi-i" data-t="50 Hz 陷波|50 Hz notch"></span></label></div>
            </div>
            <div class="method bi" data-t="算法依据一项 CDC 存档的研究，取法与 Gouteron 等 2024 年使用的一致（前屈最大 RMS ÷ 全屈曲最低 1 秒平均）：原始肌电整流后按 100 毫秒窗口算 RMS 得到包络；分子是前屈段里包络平均值最高的 1 秒窗口，分母是全屈曲保持段里包络平均值最低的 1 秒窗口，FRR = 分子 ÷ 分母；多次循环各算一个 FRR 再取平均。<br>处理步骤：原始肌电先去除均值，再做 20 Hz 高通和可选的 50 Hz 陷波（双向滤波，无相位延迟）。<br><b>节奏模式（推荐）</b>：填入口令时长（默认站立 4、前屈 4、保持 4、起身 4 秒）和循环起点，页面按时间表直接确定前屈段（分子在这里找）和保持段（分母在这里找，两端各去掉 1 秒过渡），不依赖肌电形态，也不会把起身期当成前屈期。“自动对齐起点”由肌电的高低节律估计，只在你填的起点前后各四分之一周期内搜索，务必对照波形确认。如果肌电最安静处与时间表的保持段不重叠，会给出提示。<br><b>自动检测</b>：在两侧通道 0.5 秒平滑后的包络上，找出被前后两段高活动夹住的最低谷，向两侧扩展到包络回升之前，可以拖动调整。多次循环时把分析起止之间等分，每段各找一个；起点或次数设错时可能取到起身期。保持期肌电持续偏高时，识别出的松弛段可能偏窄。原研究用位置传感器区分前屈和静息，本页用肌电形态加手动调整代替。<br>分母接近仪器噪声底时，FRR 会很大且不稳定，请同时报告分子和分母原值。其他文献对 FRR 的取法略有不同，请与你们的研究方案核对。所用参数会随记录一起保存。|The method follows a CDC-archived study and matches the approach used by Gouteron et al. 2024 (maximum flexion RMS divided by the lowest 1 s mean in full flexion): EMG is rectified and converted to a 100 ms RMS envelope; the numerator is the highest 1 s window mean of the envelope in the flexion phase, the denominator is the lowest 1 s window mean in the full-flexion hold, FRR = numerator ÷ denominator; each cycle gives its own FRR and the cycles are averaged.<br>Processing: raw EMG has its mean removed, then a 20 Hz high-pass and an optional 50 Hz notch (zero-phase filtering).<br><b>Timed protocol mode (recommended)</b>: enter the cue durations (default stand 4, flexion 4, hold 4, return 4 s) and the cycle start. The page then fixes the flexion phase (numerator is searched here) and the hold (denominator is searched here, with 1 s of transition removed at each end) from the schedule. It does not depend on the EMG shape and cannot mistake the return phase for flexion. Auto-align estimates the start from the high-low rhythm of the EMG, searching only a quarter cycle either side of the start you entered; always check it against the waveform. If the quietest EMG does not overlap the scheduled hold, a warning is shown.<br><b>Auto-detect</b>: on the 0.5 s smoothed envelope of both channels, the page finds the lowest valley flanked by two high-activity phases and widens it until the envelope rises; you can drag to adjust. With several cycles the analysis range is divided into equal parts and one window is found in each, so a wrong start or cycle count can pick up the return phase. If EMG stays high during the hold, the detected window may be too narrow. The original study used position sensors to separate flexion from rest; this page uses the EMG shape plus manual adjustment instead.<br>When the denominator is near the instrument noise floor, FRR becomes large and unstable; report the numerator and denominator values as well. Other publications define FRR slightly differently, so check against your protocol. The parameters used are saved with the record."></div>
          </details>
        </div>

        <div class="card">
          <div class="card-h"><h2 class="bi" data-t="数据安全与备份|Data safety and backup"></h2></div>
          <div class="card-b">
            <p id="cloudStat" style="margin:0 0 10px;font-size:14px"></p>
            <div id="ghCard" style="margin:0 0 12px"></div>
            <div class="safe" id="safeStat"></div>
            <div class="btn-row">
              <button class="btn primary" type="button" data-act="bakXlsx"><span class="bi-i" data-t="导出全部数据（Excel，WPS 可打开）|Export all data (Excel, opens in WPS)"></span></button>
              <button class="btn primary" type="button" data-act="bakJson"><span class="bi-i" data-t="保存完整备份 (JSON)|Save full backup (JSON)"></span></button>
              <button class="btn" type="button" data-act="showImport"><span class="bi-i" data-t="导入备份|Import backup"></span></button>
              <button class="btn" type="button" data-act="snapOpen"><span class="bi-i" data-t="恢复点|Restore points"></span></button>
            </div>
            <p class="note bi" style="margin-top:10px" data-t="Excel 文件用来查看和统计：评估汇总（VAS、ODI、TSK、FRR）、ODI 逐题、TSK 逐题、治疗后 VAS、McGill、受试者各一张表。JSON 备份用来换设备或恢复数据。两种文件都请存到电脑或网盘。|The Excel file is for viewing and analysis: one sheet each for the assessment summary (VAS, ODI, TSK, FRR), ODI items, TSK items, session VAS, McGill and participants. The JSON backup is for moving devices or restoring. Keep both on a computer or cloud drive."></p>
            <details class="bands">
              <summary class="bi-i" data-t="单独导出 CSV|Separate CSV exports"></summary>
              <div class="btn-row" style="margin-top:10px">
                <button class="btn small" type="button" data-act="bakCsv"><span class="bi-i" data-t="治疗后 VAS (CSV)|Session VAS (CSV)"></span></button>
                <button class="btn small" type="button" data-act="bakMcg"><span class="bi-i" data-t="McGill (CSV)|McGill (CSV)"></span></button>
                <button class="btn small" type="button" data-act="parCsv"><span class="bi-i" data-t="受试者表 (CSV)|Participants (CSV)"></span></button>
              </div>
            </details>
            <details class="bands">
              <summary class="bi-i" data-t="数据存在哪里，怎样才不会丢|Where the data lives and how to keep it safe"></summary>
              <div class="method bi" data-t="1. 记录只保存在这台设备的这个浏览器里：不上传，也不同步。清除网站数据、换设备、用无痕模式，数据都会消失。所以登记、随机分组和填写请固定在同一台 iPad 上做。<br>2. 每次保存后程序会读回核对；写不进去时，页面会用红字提醒你。分组结果写不进去时，不会显示分组。<br>3. 修改、覆盖、作废治疗 VAS 和 McGill 记录都不会丢旧值（每条记录有“历史”）。只有先作废、再点“永久删除”，才会彻底删掉（连历史和恢复点里的副本一起）。删除或覆盖评估记录、导入备份之前，会自动建“恢复点”，保留最近 3 个。<br>4. 每次采集结束，点“保存完整备份”（含受试者、分组、随机序列和 McGill 测试），再把文件复制到电脑或云盘，至少放两个位置。备份文件带校验码，导入时会核对是否完整。<br>5. 导入是“合并”：同一条以保存时间较新的为准，本地没有的才新增，不会清空已有数据；已经分配的组别不会被改写。<br>6. 把页面链接发给别人，对方只能打开页面，看不到你的数据。<br>7. Safari 长时间不打开一个网站时可能清理它的存储，所以每次采集结束都请备份一次。|1. Records are kept only in this browser on this device. Nothing is uploaded or synced. Clearing site data, switching devices or using a private window makes them disappear. So do enrolment, randomization and data entry on one and the same iPad.<br>2. After every save the page reads the data back to check it; if it cannot be written, a red warning appears. If an allocation cannot be stored, the group is not shown.<br>3. Editing, overwriting or voiding a session VAS or McGill entry never loses the old value (each entry has a History). Only void first and then press Delete permanently erases an entry for good (history and the copies in restore points included). A restore point is created automatically before deleting or overwriting an assessment record or importing a backup; the latest 3 are kept.<br>4. When a collection session ends, press Save full backup (it includes participants, groups, the randomization list and the McGill tests) and copy the file to a computer or cloud drive: at least two places. The backup file carries a checksum that is verified on import.<br>5. Import is a merge: for the same entry the later saved version wins, entries missing locally are added, and nothing already stored is wiped; an allocation that already exists is never rewritten.<br>6. Sharing the page link only lets others open the page; they cannot see your data.<br>7. Safari may clear a site’s storage after a long time without opening it, so back up at the end of every collection session."></div>
            </details>
            <div id="importWrap" hidden>
              <p class="note bi" style="margin-top:12px" data-t="选择备份文件，或把备份文本粘贴到下面。|Choose a backup file, or paste the backup text below."></p>
              <div class="btn-row" style="margin-top:8px"><label class="btn small"><input type="file" id="impFile" accept=".json,.txt,application/json,text/plain" hidden><span class="bi-i" data-t="选择备份文件|Choose backup file"></span></label></div>
              <textarea id="importBox" class="copybox" placeholder="粘贴备份 JSON / Paste backup JSON" spellcheck="false"></textarea>

        <div class="card staffonly">
          <details class="bands" style="padding:4px 16px 8px">
            <summary class="bi-i" data-t="这把尺怎样符合 VAS 的测量要求|How this ruler follows VAS measurement requirements"></summary>
            <div class="method bi" data-t="1. 一条 100 mm 的水平线，左端“无痛”，右端“能想象到的最剧烈疼痛”；线上没有数字、刻度或中间描述（Hawker 等，2011，Arthritis Care Res 63(S11):S240–S252）。<br>2. 由受试者自己在线上点一个位置，不需要评估者；读数是从左端到标记的毫米数，本页取整到 1 mm。<br>3. 线上一开始没有预设标记，避免把受试者引向某个数；开启右上角“患者填写模式”后，数值、历史和曲线全部隐藏。<br>4. 每次提问都要写明回忆期（此刻 / 过去 24 小时 / 过去 7 天），同一项研究里应固定一种（Hawker 等，2011）。回忆期在“受试者”页的“研究设置”里统一设定，每条记录都存了它用的提问。<br>5. 屏幕上的实际长度取决于设备，所以要先“校准屏幕”：用直尺量一次即可。笔记本电脑上的电子 VAS 与纸质版一致，手机上有约 2% 的小偏差，作者认为低于最小临床重要差异 1.4 cm（Delgado 等，2018，J Am Acad Orthop Surg Glob Res Rev 2(3):e088）；仍建议用 iPad 或电脑。手机竖屏放不下 100 mm 时，页面会明确标为“适配屏宽”。<br>6. 每条记录都带着尺的状态（已校准尺 / 未校准尺 / 适配屏宽 / 手动输入），分析时可以据此筛选。<br>7. 本页只管采集，不替你判定“有无临床意义的变化”；阈值请按研究方案和文献自行设定。|1. A horizontal 100 mm line, “No pain” at the left end and “Worst pain imaginable” at the right; no numbers, tick marks or intermediate descriptors on the line (Hawker et al., 2011, Arthritis Care Res 63(S11):S240–S252).<br>2. The participant places the mark alone; no assessor is needed. The score is the millimetres from the left end to the mark, rounded to 1 mm here.<br>3. The line starts with no preset mark, so the participant is not steered towards a number. With Patient mode (top right) on, values, history and the trend are all hidden.<br>4. Every question states a recall period (right now / past 24 h / past 7 days). Keep one fixed through a study (Hawker et al., 2011). Set it once in Study settings on the Participants page; each entry stores the question it used.<br>5. The real length on a screen depends on the device, so Calibrate screen first: measure once with a ruler. An electronic VAS on a laptop agreed with paper; on a mobile phone there was a small difference of about 2%, which the authors judged below the 1.4 cm minimal clinically important difference (Delgado et al., 2018, J Am Acad Orthop Surg Glob Res Rev 2(3):e088). An iPad or computer is still preferable. When a phone in portrait cannot fit 100 mm, the page labels the entry “fitted to screen”.<br>6. Each entry carries the ruler state (calibrated / uncalibrated / fitted to screen / typed in) so you can filter on it in the analysis.<br>7. This page only collects data. It does not judge whether a change is clinically meaningful; set thresholds from your protocol and the literature."></div>

        <div class="card">

            <summary class="bi-i" data-t="测试方法、比值和参考范围|Methods, ratios and reference ranges"></summary>
            <div class="method bi" data-t="1. McGill 核心耐力测试由三种测试、共四个计时组成：躯干屈肌、躯干伸肌（Biering-Sørensen 法）、右侧桥和左侧桥（McGill 等，1999，Arch Phys Med Rehabil 80:941–944）。每项记录的是姿势能够保持的秒数。<br>2. 终止标准按各项的要点执行（点每一项下面的“这一项怎么做”）；统一标准比计时精度更重要。是否设置时间上限，请按研究方案；本页不设上限，但超过 600 秒会提醒核对，超过 3600 秒无法录入。<br>3. 因疼痛而终止，还是因姿势保持不住而终止，临床意义不同，请写在备注里。<br>4. 本页计算四个比值，并用红色标出超出 McGill 参考范围的数值：屈肌/伸肌 &lt; 1.0；右侧桥/左侧桥与 1.0 相差不超过 0.05；单侧侧桥/伸肌 &lt; 0.75（ACE 公布的 McGill 测试方案转述；左右比 0.05 的出处是 McGill 2002 的建议，见 Pagé &amp; Descarreaux 2012，Chiropr Man Therap 20:12 的引用）。<br>5. 这些是 McGill 提出的参考范围，不是诊断界值。Pagé 和 Descarreaux 指出，健康成人的左右比也常超过 0.05，这个比值的正常范围尚未被证实。因此红色只是提示，不代表异常。<br>6. 统计表只做描述（均值、标准差、前后变化），不替你做假设检验；右侧桥指右肘在下，左侧桥指左肘在下，请在整个研究里保持一致。|1. The McGill core endurance tests are three tests with four timings: trunk flexor, trunk extensor (Biering-Sørensen method), right side bridge and left side bridge (McGill et al., 1999, Arch Phys Med Rehabil 80:941–944). Each records the seconds the position can be held.<br>2. Apply the stopping criteria of each test (open How to do it under each one); a consistent criterion matters more than timing precision. Whether to cap the time is up to your protocol; this page sets no cap, asks you to check anything over 600 s, and cannot take more than 3600 s.<br>3. Stopping because of pain and stopping because the position cannot be held mean different things clinically; write which in the note.<br>4. The page computes four ratios and marks in red any outside McGill’s reference range: flexor : extensor &lt; 1.0; right : left side bridge within 0.05 of 1.0; each side bridge : extensor &lt; 0.75 (as given in the ACE-published McGill test protocol; the 0.05 left-right figure goes back to McGill’s 2002 recommendation, as cited by Pagé &amp; Descarreaux 2012, Chiropr Man Therap 20:12).<br>5. These are reference ranges proposed by McGill, not diagnostic cut-offs. Pagé and Descarreaux point out that healthy adults often exceed 0.05 on the left-right ratio and that its normal range is not established. Red is therefore only a flag, not a finding of abnormality.<br>6. The statistics are descriptive only (mean, SD, change from baseline) and run no hypothesis tests. Right side bridge means right elbow down and left side bridge means left elbow down; keep that the same throughout the study."></div>

<script>
/* Rescue layer (standalone): runs before the main script and does not depend on it.
   - If browser storage lost the data but the IndexedDB mirror still has it, put it back and reload once.
   - If the page fails to start, show what is stored, offer it as a file, and copy it to the private GitHub repo if one is connected. */
(function(){
  var errs=[];window.__odiErrs=errs;
  var RAW_PREFIX='odi-tsk:',MAIN=['odi-tsk:records:v1','odi-tsk:par:v1','odi-tsk:sessions:v1','odi-tsk:mcg:v1'];
  function note(m){errs.push(String(m).slice(0,600));if(document.getElementById('rescue'))paint()}
  window.addEventListener('error',function(e){note((e.message||'error')+(e.lineno?' @'+e.lineno+':'+e.colno:'')+(e.error&&e.error.stack?'\n'+String(e.error.stack).split('\n').slice(0,4).join('\n'):''));show()});
  window.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;note('promise: '+(r&&(r.message||r.code)||String(r)))});
  function len(v){try{var a=JSON.parse(v||'null');return Array.isArray(a)?a.length:0}catch(e){return 0}}
  /* ---- IndexedDB mirror → localStorage, when localStorage lost data ---- */
  try{
    if(window.indexedDB&&!sessionStorage.getItem('odi-idb-restored')){
      var rq=indexedDB.open('odi-tsk-mirror',1);
      rq.onupgradeneeded=function(){rq.result.createObjectStore('kv')};
      rq.onsuccess=function(){
        try{
          var db=rq.result,g=db.transaction('kv','readonly').objectStore('kv').get('mirror');
          g.onsuccess=function(){
            var m=g.result;db.close();
            if(!m||!m.keys)return;
            var lost=MAIN.some(function(k){return len(m.keys[k])>len(localStorage.getItem(k))});
            if(!lost)return;
            window.__idbRestoring=true;
            /* keep whatever is in localStorage now, then write the mirror's longer arrays back */
            try{localStorage.setItem('odi-tsk:idb-before:'+Date.now(),JSON.stringify(MAIN.reduce(function(o,k){o[k]=localStorage.getItem(k);return o},{})))}catch(e){}
            Object.keys(m.keys).forEach(function(k){
              var cur=localStorage.getItem(k);
              if(MAIN.indexOf(k)>=0?len(m.keys[k])>len(cur):cur===null){try{localStorage.setItem(k,m.keys[k])}catch(e){}}
            });
            sessionStorage.setItem('odi-idb-restored','1');
            location.reload();
          };
        }catch(e){}
      };
    }
  }catch(e){}

/* ---------- permuted-block list ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  return ('00000000'+b[0].toString(16)).slice(-8);

function seedNum(t){
  t=String(t).trim();
  if(/^[0-9a-f]{1,8}$/i.test(t))return parseInt(t,16)>>>0;
  var h=2166136261,i;for(i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
  return h>>>0;

function genList(N,m,seed,sizes){
  var rng=mulberry32(seedNum(seed)),arms=[],i;
  for(i=0;i<m;i++)arms.push(String.fromCharCode(65+i));

  for(i=1;i<=N+40;i++)dp[i]=sizes.some(function(s){return i-s>=0&&dp[i-s]});
  var list=[],used=[];
  while(list.length<N){

    var s,blk=[],k;
    if(cand.length)s=cand[Math.floor(rng()*cand.length)];
    else{s=sizes.filter(function(x){return x>=rem})[0]||sizes[0]}   /* N cannot be tiled exactly by whole blocks: the last block is cut short */
    for(k=0;k<s;k++)blk.push(arms[k%m]);
    for(k=blk.length-1;k>0;k--){var j=Math.floor(rng()*(k+1)),t=blk[k];blk[k]=blk[j];blk[j]=t}

function armSplit(list){var c={};list.forEach(function(a){c[a]=(c[a]||0)+1});return Object.keys(c).sort().map(function(a){return a+' '+c[a]}).join(' · ')}

  var need=Math.max(sizes[0],N-extCount());
  var g=genList(need,m,seed,sizes);
  RL={v:1,N:N,arms:g.arms,blocks:sizes,seed:seed,src:'generated',created:Date.now(),hash:'',list:g.list,ext:[]};
  prefs.N=N;prefs.arms=m;savePrefs();
  return hashStr(g.list.join('')).then(function(h){RL.hash=h;return persistRand()});
}
function randExtend(add){
  var m=RL.arms.length,sizes=[2*m,3*m],seed=seedHex();
  var g=genList(add,m,seed,sizes);
  RL.list=RL.list.concat(g.list);RL.N+=add;RL.ext.push({at:Date.now(),added:g.list.length,seed:seed});
  return hashStr(RL.list.join('')).then(function(h){RL.hash=h;return persistRand()});
}
function parseList(text){
  var toks=text.toUpperCase().split(/[\s,;，；、]+/).filter(Boolean),list=[],bad=null;
  toks.forEach(function(t){
    if(bad)return;
    if(!/^[A-D1-4]+$/.test(t)){bad=t;return}
    t.split('').forEach(function(ch){list.push(/[1-4]/.test(ch)?String.fromCharCode(64+(+ch)):ch)});
  });
  return {list:list,bad:bad};
}

/* ---------- allocation ---------- */
function randAssign(id){
  var p=getPar(id);
  if(p&&p.arm)return {arm:p.arm,idx:p.ridx,already:true};
  if(!RL)return {err:'none'};
  var i=nextIdx();
  if(i>=RL.list.length)return {err:'exhausted'};
  var made=false;
  if(!p){p=addPar(id,{});made=true}
  p.arm=RL.list[i];p.ridx=i;p.rat=Date.now();p.src='list';
  if(!persistPar()){
    p.arm='';p.ridx=-1;p.rat=0;p.src='';
    if(made)participants=participants.filter(function(q){return q!==p});
    return {err:'store'};
  }
  return {arm:p.arm,idx:i};
}
function revealArm(id,res){
  var big='<div class="armbig"><span class="armtag lg">'+esc(res.arm)+'</span><div class="armbig-t">'+B(esc(res.arm)+' 组','Group '+esc(res.arm))+'</div></div>';
  var body='<p><b class="mono">'+esc(id)+'</b> '+B('已随机分组，结果已保存。','is randomized and the result is saved.')+'</p>';
  if(prefs.blind)body+='<div id="armWrap"><button type="button" class="btn" data-act="revealArm"><span class="bi-i">'+B('显示分组（请由工作人员点）','Show group (staff only)')+'</span></button><div id="armBig" hidden>'+big+'</div></div>';
  else body+=big;
  body+='<p class="note">'+B('随机序列第 '+(res.idx+1)+' 位。请把 iPad 交给治疗师。','List position '+(res.idx+1)+'. Hand the iPad to the therapist.')+'</p>';
  return ask({title:B('随机分组完成','Randomization done'),body:body,buttons:[{v:'ok',kind:'primary',label:B('好，回到名单','Done, back to the list')}]});
}
function randomizeFlow(id){
  if(extMode()){
    parRender();
    if(prefs.blind){pendingReveal={id:id,rx:true};go('par');return}
    go('par');rxDialog(id);return;
  }
  var p=getPar(id);
  if(p&&p.arm){toast(B(esc(id)+' 已经分过组了（'+esc(p.arm)+' 组）。','Already allocated ('+esc(p.arm)+').'));go('par');return}
  if(!RL){
    go('par');
    ask({title:B('还没有随机序列','No randomization list yet'),
      body:'<p class="note">'+B('这位受试者的基线已经保存，但还不能分组：请先在下面的“随机化”卡片生成随机序列，再点这位受试者那一行的“随机分组”。','The baseline is saved but the participant cannot be allocated yet. Generate the list in the Randomization card below, then press Randomize on this participant’s row.')+'</p>',
      buttons:[{v:'ok',kind:'primary',label:B('知道了','OK')}]}).then(function(){var c=$('#rndCard');if(c&&c.scrollIntoView)c.scrollIntoView({behavior:'smooth',block:'center'})});
    return;
  }
  if(prefs.blind){
    /* patient mode: allocate quietly; staff see the result once patient mode is switched off */
    var res0=RL?randAssign(id):{err:'none'};
    if(!res0.err)pendingReveal={id:id,res:res0};
    parRender();go('par');
    return;
  }
  var res=randAssign(id);
  if(res.err==='exhausted'){
    go('par');
    ask({title:B('随机序列已用完','The list is used up'),body:'<p class="note">'+B('序列里的名额都已分配。请在“随机化”卡片点“追加名额”，再给这位受试者分组。','Every position in the list is used. Press Add places in the Randomization card, then allocate this participant.')+'</p>',buttons:[{v:'ok',kind:'primary',label:B('知道了','OK')}]});
    return;
  }
  if(res.err){
    go('par');
    ask({title:B('没有分组','Not allocated'),body:'<p class="note">'+B('分组结果没能写入浏览器存储，所以没有分配（也不会显示）。请先保存完整备份，换一个能保存的浏览器后再试。','The result could not be written to browser storage, so nothing was allocated or shown. Save a full backup and retry in a browser that can store data.')+'</p>',buttons:[{v:'ok',kind:'primary',label:B('知道了','OK')}]});
    return;
  }
  parRender();
  revealArm(id,res).then(function(){go('par');parRender()});
}

/* ---------- enrolment ---------- */
function enroll(){
  var id=($('#nId').value||'').trim().toUpperCase().replace(/\s+/g,'');
  var consent=$('#nConsent').checked,cd=$('#nDate').value,err=null,age=parseInt($('#nAge').value,10);
  if(!id)err=B('请填写编号。','Enter an ID.');
  else if(!/^[A-Z0-9_-]{1,20}$/.test(id))err=B('编号只能用字母、数字、短横线或下划线（不要用姓名）。','Use letters, digits, hyphen or underscore only (not a name).');
  else if(!consent)err=B('请先确认已签署纸质知情同意书。','Confirm the paper consent form is signed first.');
  else if(!cd)err=B('请填写知情同意日期。','Enter the consent date.');
  else if(allIds().indexOf(id)>=0)err=B('编号 '+esc(id)+' 已经存在。','ID '+esc(id)+' already exists.');
  else if(extMode()&&!(age>=10&&age<=100))err=B('请填写年龄（岁），用于选择随机化的年龄层。','Enter the age in years; it picks the randomisation stratum.');
  if(err){toast(err);return}
  if(!(age>=10&&age<=100))age=null;
  var go0=age!==null&&(age<18||age>60)
    ?ask({title:B('年龄不在纳入范围','Age outside the inclusion range'),body:'<p class="note">'+B('方案纳入 18–60 岁，这位是 '+age+' 岁。确定入组吗？','The protocol includes ages 18–60; this person is '+age+'. Enrol anyway?')+'</p>',buttons:[{v:'cancel',kind:'primary',label:B('取消','Cancel')},{v:'ok',label:B('仍然入组','Enrol anyway')}]}).then(function(r){return r.v==='ok'})
    :Promise.resolve(true);
  var go1=go0.then(function(y){if(!y)return false;return participants.length>=planN()
    ?ask({title:B('已达计划例数','Planned sample reached'),body:'<p class="note">'+B('已入组 '+participants.length+' 人，计划 '+planN()+' 人。确定还要再入组一位吗？','Already '+participants.length+' enrolled; planned '+planN()+'. Enrol one more?')+'</p>',buttons:[{v:'ok',kind:'primary',label:B('继续入组','Enrol')},{v:'cancel',label:B('取消','Cancel')}]}).then(function(r){return r.v==='ok'})
    :true});
  go1.then(function(yes){
    if(!yes)return;
    var p=addPar(id,{consent:true,consentDate:cd,age:age});
    if(!persistPar()){
      participants=participants.filter(function(q){return q!==p});
      toast(B('<b>没能写入浏览器存储！</b>这位受试者没有登记。请先保存完整备份。','<b>Could not write to browser storage!</b> The participant was not registered. Save a full backup first.'));
      return;
    }
    nIdDirty=false;$('#nConsent').checked=false;$('#nDate').value=today();$('#nAge').value='';
    parRender();startAssessment(id,'baseline');
  });
}

/* ====================== assessment flow (VAS, ODI, TSK on one run) ====================== */
var aR=null,sesFrom=null;
function tpKeys(){

  else{
    var a=armOf(state.id);

  }

  $('#c-info').textContent=(has?1:0)+'/1';$('#c-info').classList.toggle('full',has);
  vasReadout();paintDraft();

function draftDirty(){
  var has=state.vas!==''||state.frrL!==''||state.frrR!==''||countAnswered(state.odi)>0||countAnswered(state.tsk)>0;
  if(!has)return false;
  var ex=find(keyOf(state));
  if(!ex)return true;
  var b=buildRecord();
  return JSON.stringify([b.vas,b.frrL,b.frrR,state.odi,state.tsk])!==JSON.stringify([ex.vas,ex.frrL,ex.frrR,ex.odiItems||Array(10).fill(null),ex.tskItems||Array(11).fill(null)]);
}
function resetDraft(){state.id='';state.tp='baseline';state.date=today();state.assessor='';clearAnswers()}
function startAssessment(id,tp){
  var key=id+'|'+tp,ex=find(key);
  var proceed=function(){
    if(ex){loadRecord(key);return}
    clearAnswers();
    state.id=id;state.tp=tp;state.date=today();state.assessor='';
    fillInfo();update();go('info');enterPt();
  };
  if(!(state.id===id&&state.tp===tp)&&state.id&&draftDirty()){
    ask({title:B('上一位还没提交','The previous run is not submitted'),
      body:'<p class="note">'+B(esc(state.id)+' · '+esc(TP[state.tp].zh)+' 的作答还没有提交。丢弃后会清空这些答案。','The answers for '+esc(state.id)+' · '+esc(TP[state.tp].en)+' are not submitted. Discarding clears them.')+'</p>',
      buttons:[{v:'back',kind:'primary',label:B('回去继续那一位','Go back to it')},{v:'drop',kind:'danger',label:B('丢弃并继续','Discard and continue')}]}).then(function(r){
      if(r.v==='drop')proceed();
      else if(r.v==='back')go('info');
    });
  }else if(state.id===id&&state.tp===tp){go('info');enterPt()}
  else proceed();
}
function doSave(){
  var rec=buildRecord(),k=keyOf(rec),i,replaced=false;
  for(i=0;i<records.length;i++){if(keyOf(records[i])===k){snapshot('overwrite');records[i]=rec;replaced=true;break}}
  if(!replaced)records.push(rec);
  var stored=persist();
  if(!getPar(rec.id)){addPar(rec.id,{});persistPar()}
  renderRecords();update();safeRender();parRender();
  return {rec:rec,replaced:replaced,stored:stored};
}
function finishLabel(){
  var ex=find(keyOf(state));
  if(state.tp==='baseline'&&state.id&&!armOf(state.id)&&!extMode())return B('提交并随机分组','Submit and randomize');
  return ex?B('覆盖并提交','Overwrite and submit'):B('提交','Submit');
}
function finish(){
  var err=validateInfo();
  if(err){toast(err);go('info');return}
  var o=odiCalc(state.odi),t=tskCalc(state.tsk,TSK),miss=[],first=null;
  if(num(state.vas)===null){miss.push(B('VAS（还没在线上标记）','VAS (no mark on the line yet)'));first=first||'info'}
  if(!o.valid){miss.push(B('ODI（至少答 9 个部分）','ODI (at least 9 sections)'));first=first||'odi'}
  if(t.total===null){miss.push(B('TSK-11（11 题都要答）','TSK-11 (all 11 items)'));first=first||'tsk'}
  var ex=find(keyOf(state));
  var p1=miss.length
    ?ask({title:B('还有内容没填','Something is still missing'),
        body:'<ul class="mlist">'+miss.map(function(m){return '<li>'+m+'</li>'}).join('')+'</ul>',
        buttons:[{v:'back',kind:'primary',label:B('返回补填','Go back and fill it')},{v:'go',label:B('仍然提交（留空）','Submit anyway (left blank)')}]}).then(function(r){return r.v==='go'})
    :Promise.resolve(true);
  p1.then(function(ok){
    if(!ok){if(first)go(first);return false}
    if(!ex)return true;
    return ask({title:B('覆盖已有的记录？','Overwrite the existing record?'),
      body:'<p class="note">'+B('已有 '+esc(state.id)+' · '+esc(TP[state.tp].zh)+' 的记录（保存于 '+esc(fmtDT(ex.saved))+'）。覆盖后旧记录会存进“恢复点”。','A record for '+esc(state.id)+' · '+esc(TP[state.tp].en)+' exists (saved '+esc(fmtDT(ex.saved))+'). If you overwrite, the old one goes into a restore point.')+'</p>',
      buttons:[{v:'ok',kind:'primary',label:B('覆盖','Overwrite')},{v:'cancel',label:B('取消','Cancel')}]}).then(function(r){return r.v==='ok'});
  }).then(function(ok){
    if(!ok)return;
    var r=doSave();
    if(!r.stored){
      toast(B('<b>没有写入浏览器存储！</b>请立刻保存完整备份，并保持本页打开。','<b>Not written to browser storage!</b> Save a full backup right now and keep this page open.'));
      return;
    }
    var id=r.rec.id,tp=r.rec.tp;
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    resetDraft();
    if(tp==='baseline'&&!armOf(id)){randomizeFlow(id);return}
    go('par');
    toast(B('已提交 '+esc(id)+' · '+esc(TP[tp].zh)+(r.replaced?'（已覆盖）':'')+'。','Submitted '+esc(id)+' · '+esc(TP[tp].en)+(r.replaced?' (overwritten)':'')+'.'));
  });
}

var sd=Object.assign({id:'',n:1,when:'post'},LS.get(K_SESD)||{});
sd.date=today();sd.note='';sd.how='ruler';
if(typeof sd.id!=='string')sd.id='';

if(sd.when!=='pre'&&sd.when!=='post')sd.when='post';
var sesFilter=sd.id||'all',sesRuler=null;
function saveSd(){LS.set(K_SESD,{id:sd.id,n:sd.n,when:sd.when})}
function sesKey(){return sd.id+'|'+sd.n+'|'+sd.when}
function suggest(id){
  var list=sesActive().filter(function(e){return e.id===id});
  if(!list.length){sd.n=1;sd.when='post';return}
  var usePre=list.some(function(e){return e.when==='pre'});
  var mx=Math.max.apply(null,list.map(function(e){return e.n}));
  var has=function(w){return list.some(function(e){return e.n===mx&&e.when===w})};
  if(usePre){if(has('post')){sd.n=mx+1;sd.when='pre'}else{sd.n=mx;sd.when=has('pre')?'post':'pre'}}
  else{sd.n=has('post')?mx+1:mx;sd.when='post'}
}

function sesWho(){

  sel.innerHTML='<option value="">'+esc(lb('— 选择受试者 —','— choose a participant —'))+'</option>'+ids.map(function(id){var a=prefs.blind?'':armOf(id);return '<option value="'+esc(id)+'">'+esc(id+(a?' · '+armTxt(a):''))+'</option>'}).join('');

/* ---------- table + chart ---------- */
function sesRowHTML(e){
  var k=sesKeyOf(e),mask=prefs.blind,tags='';
  if(e.rev>0)tags+=' <span class="tag">'+B('改×'+e.rev,'edited ×'+e.rev)+'</span>';
  if(e.void)tags+=' <span class="tag warn">'+B('作废','void')+'</span>';
  if(e.note)tags+=' <span class="tag">'+B('备注','note')+'</span>';
  var it=itemOf(e.item),sc=scrOf2(e.scr),a=armOf(e.id);
  var tip=lb(it.zh,it.en)+' · '+lb(sc.zh,sc.en)+(e.note?' · '+e.note:'');
  var btn=function(act,zh,en,kind,extra){return '<button type="button" class="btn small'+(kind?' '+kind:'')+'" data-act="'+act+'" data-v="'+esc(k)+'"'+(extra||'')+'><span class="bi-i">'+B(zh,en)+'</span></button>'};
  var acts=e.void
    ?btn('sRestore','恢复','Restore')+btn('sPurge','永久删除','Delete permanently','danger')+btn('sHist','历史','History')
    :btn('sLoad','载入','Load')+btn('sVoid','作废','Void')+(e.hist.length?btn('sHist','历史','History'):'');
  return '<tr class="'+(e.void?'void':'')+'" title="'+esc(tip)+'"><td class="num">'+esc(e.id)+'</td><td>'+(a&&!mask?'<span class="armtag">'+esc(a)+'</span>':'<span class="mut">'+(mask&&a?'••':'—')+'</span>')+'</td><td class="num">'+e.n+'</td>'
   +'<td><span class="bi-i">'+(e.when==='pre'?B('前','Pre'):B('后','Post'))+'</span></td><td class="num vv"><b>'+(mask?'••':fmt(e.vas))+'</b>'+tags+'</td>'
   +'<td class="num">'+esc(e.at?fmtDT(e.at):e.date)+'</td><td class="act">'+acts+'</td></tr>';
}
function sesChartHTML(id){
  var list=sessions.filter(function(e){return e.id===id&&!e.void});
  if(!list.length)return '';
  var W=640,H=250,l=46,r=18,t=14,b=46,mx=Math.max.apply(null,list.map(function(e){return e.n})),dom=Math.max(mx,3);
  var X=function(n){return l+(n-0.5)/dom*(W-l-r)},Y=function(v){return t+(100-v)/100*(H-t-b)};
  var g='',i;
  [0,25,50,75,100].forEach(function(v){g+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" class="gl"/><text x="'+(l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" class="tx">'+v+'</text>'});
  var step=dom>20?5:1;
  for(i=1;i<=dom;i++)if(i%step===0||i===1)g+='<text x="'+X(i)+'" y="'+(H-b+18)+'" text-anchor="middle" class="tx">'+i+'</text>';
  g+='<text x="'+((l+W-r)/2)+'" y="'+(H-6)+'" text-anchor="middle" class="tx">'+esc(lb('治疗次数','Session no.'))+'</text>';
  g+='<text x="12" y="'+((t+H-b)/2)+'" text-anchor="middle" class="tx" transform="rotate(-90 12 '+((t+H-b)/2)+')">VAS (mm)</text>';
  ['pre','post'].forEach(function(w){
    var pts=list.filter(function(e){return e.when===w}).sort(function(a,b){return a.n-b.n});
    if(!pts.length)return;
    if(pts.length>1)g+='<polyline class="ln '+w+'" points="'+pts.map(function(e){return X(e.n)+','+Y(e.vas)}).join(' ')+'"/>';
    pts.forEach(function(e){g+='<circle class="pt '+w+'" cx="'+X(e.n)+'" cy="'+Y(e.vas)+'" r="5"><title>'+esc(id)+' #'+e.n+' '+esc(lb(WHEN[w].zh,WHEN[w].en))+': '+fmt(e.vas)+' mm</title></circle>'});
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(lb('治疗 VAS 变化曲线','Session VAS trend'))+'">'+g+'</svg>'
   +'<div class="legend"><span class="lg"><svg width="16" height="12"><circle cx="8" cy="6" r="5" class="pt post"/></svg><span class="bi-i">'+B('治疗后','After treatment')+'</span></span><span class="lg"><svg width="16" height="12"><circle cx="8" cy="6" r="4.5" class="pt pre"/></svg><span class="bi-i">'+B('治疗前','Before treatment')+'</span></span></div>';
}
function sesRender(){
  var ids=allIds().filter(function(id){return sessions.some(function(e){return e.id===id})});
  if(sesFilter!=='all'&&ids.indexOf(sesFilter)<0)sesFilter=ids.indexOf(sd.id)>=0?sd.id:'all';
  $('#sFilter').innerHTML='<option value="all">'+esc(lb('全部受试者','All participants'))+'</option>'+ids.map(function(id){return '<option value="'+esc(id)+'">'+esc(id)+'</option>'}).join('');
  $('#sFilter').value=sesFilter;
  sortSessions();
  var heads=[['编号','ID'],['分组','Group'],['次数','No.'],['治疗前/后','Pre / post'],['VAS (mm)','VAS (mm)'],['记录时间','Recorded'],['','']];
  var th='<thead><tr>'+heads.map(function(h){return '<th class="bi">'+(h[0]?B(h[0],h[1]):'')+'</th>'}).join('')+'</tr></thead>';
  var shown=sessions.filter(function(e){return sesFilter==='all'||e.id===sesFilter});
  var rows=shown.map(sesRowHTML).join('');
  if(!rows)rows='<tr><td class="empty bi" colspan="7">'+B('还没有治疗 VAS 记录。受试者在线上标记、点“提交”后，这里会出现一行。','No session VAS yet. After the participant marks the line and you press Submit, a row appears here.')+'</td></tr>';
  $('#sTable').innerHTML=th+'<tbody>'+rows+'</tbody>';
  var act=sesActive().length,voids=sessions.length-act;
  $('#sFoot').innerHTML=B('共 '+act+' 条有效记录'+(voids?'，另有 '+voids+' 条已作废。作废只是打上标记，数据仍保留；要彻底删掉，请在作废的那一行点“永久删除”。':'。'),'Total '+act+' active entries'+(voids?', plus '+voids+' voided. Voiding only flags an entry and keeps the data; to erase it for good, press Delete permanently on the voided row.':'.'));
  $('#sPurgeAll').hidden=!voids;
  $('#c-ses').textContent=act;
  var ch=$('#sChart');
  if(prefs.blind){ch.innerHTML='<div class="blindmsg bi">'+B('患者填写模式：曲线和数值已隐藏。','Patient mode: trend and values are hidden.')+'</div>'}
  else if(sesFilter==='all'){ch.innerHTML='<div class="blindmsg bi">'+B('在上方选择一位受试者，查看他/她的变化曲线。','Choose one participant above to see the trend.')+'</div>'}
  else ch.innerHTML=sesChartHTML(sesFilter)||'<div class="blindmsg bi">'+B('这位受试者还没有有效记录。','No active entries for this participant yet.')+'</div>';
  $('#sValFld').hidden=!!prefs.blind;
  paintBackup();
}

/* ---------- saving ---------- */
function histOf(e,why){return {vas:e.vas,item:e.item,site:e.site,date:e.date,at:e.at,assessor:e.assessor,note:e.note,scr:e.scr,rev:e.rev,saved:e.saved,void:e.void,why:why}}
function sesSave(){
  var v=sesRuler.val,err=null;
  if(!sd.id)err=B('请先选择受试者。','Choose a participant first.');
  else if(!sd.date)err=B('请填写日期。','Enter a date.');
  else if(v===null)err=B('受试者还没有在线上标记。','The participant has not marked the line yet.');
  if(err){toast(err);return}
  var manual=sd.how==='manual',val=manual?Math.round(v*10)/10:Math.round(v);
  var scr=manual?'manual':sesRuler.quality();
  var ex0=sesFind(sesKey());
  var chain=ex0
    ?ask({title:B('覆盖已有的记录？','Overwrite the existing entry?'),
        body:'<p class="note">'+B('编号 '+esc(sd.id)+'，第 '+sd.n+' 次，'+WHEN[sd.when].zh+'，已经有一条（'+esc(fmtDT(ex0.saved))+'）'+(prefs.blind?'':'，VAS = '+fmt(ex0.vas)+' mm')+(ex0.void?'，已作废':'')+'。覆盖后旧值会保留在这条记录的“历史”里，不会丢失。','ID '+esc(sd.id)+', No. '+sd.n+', '+WHEN[sd.when].en+' already has an entry ('+esc(fmtDT(ex0.saved))+')'+(prefs.blind?'':', VAS = '+fmt(ex0.vas)+' mm')+(ex0.void?', voided':'')+'. If you overwrite, the old value is kept in this entry’s History.')+'</p>',
        buttons:[{v:'ok',kind:'primary',label:B('覆盖','Overwrite')},{v:'cancel',label:B('取消','Cancel')}]}).then(function(r){return r.v==='ok'})
    :Promise.resolve(true);
  chain.then(function(go2){
    if(!go2)return;
    var now=Date.now(),ex=sesFind(sesKey());
    var fields={vas:val,item:prefs.vasItem||'now',site:prefs.vasSiteEn||'back pain',date:sd.date,at:now,assessor:'',note:sd.note,scr:scr};
    if(ex){ex.hist.push(histOf(ex,'overwrite'));Object.assign(ex,fields);ex.rev++;ex.saved=now;ex.void=false;ex.voidWhy='';ex.voidAt=0}
    else sessions.push(Object.assign({id:sd.id,n:sd.n,when:sd.when,created:now,saved:now,rev:0,hist:[],void:false,voidWhy:'',voidAt:0},fields));
    sortSessions();
    var ok=persistSes();
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    var done=sd.when,doneN=sd.n,doneId=sd.id;
    sesRuler.setValue(null);sd.note='';sd.how='ruler';$('#sVal').value='';
    suggest(sd.id);sesFilter=sd.id;sd.date=today();
    saveSd();sesSyncForm();sesRender();safeRender();parRender();
    toast(ok?B('已提交：'+esc(doneId)+' 第 '+doneN+' 次'+WHEN[done].zh+(prefs.blind?'':'，'+fmt(val)+' mm')+(ex?'（已覆盖）':'')+'。','Submitted: '+esc(doneId)+' No. '+doneN+' '+WHEN[done].en+(prefs.blind?'':', '+fmt(val)+' mm')+(ex?' (overwritten)':'')+'.')
      :B('<b>没有写入浏览器存储！</b>请立刻保存完整备份。','<b>Not written to browser storage!</b> Save a full backup right now.'));
    if(ok&&(sesFrom==='par'||prefs.blind)){sesFrom=null;go('par')}
  });
}
function startSession(id){
  sd.id=id;suggest(id);sd.date=today();sd.note='';sd.how='ruler';sesFilter=id;saveSd();
  go('ses');
  sesRuler.setValue(null);$('#sVal').value='';
  sesFrom='par';
  enterPt();
}
function sesLoad(k){
  var e=sesFind(k);if(!e)return;
  sd.id=e.id;sd.n=e.n;sd.when=e.when;sd.note=e.note;sd.date=e.date||today();sd.how='ruler';
  sesFilter=e.id;saveSd();sesSyncForm();sesRender();
  sesRuler.setValue(prefs.blind?null:e.vas);$('#sVal').value=prefs.blind?'':fmt(e.vas);
  toast(B('已载入 '+esc(e.id)+' 第 '+e.n+' 次。重新标记并提交，就是修改。','Loaded '+esc(e.id)+' No. '+e.n+'. Mark again and submit to change it.'));
  window.scrollTo({top:$('#sForm').getBoundingClientRect().top+window.pageYOffset-70,behavior:'smooth'});
}
function sesVoid(k){
  var e=sesFind(k);if(!e)return;
  ask({title:B('作废这条记录？','Void this entry?'),
    body:'<p class="note">'+B('作废不会删除数据：这条仍保留在备份和导出里，只是带上“作废”标记，随时可以恢复。作废之后，如果确定不要了，可以在表里点“永久删除”。','Voiding does not delete anything. The entry stays in backups and exports flagged as void, and can be restored at any time. Once voided you can erase it for good with Delete permanently in the table.')+'</p><p><b class="mono">'+esc(e.id)+' · '+e.n+' · '+esc(lb(WHEN[e.when].zh,WHEN[e.when].en))+'</b></p>',
    input:{label:B('原因（可不填，例如：误触、重复）','Reason (optional, e.g. mis-tap, duplicate)')},
    buttons:[{v:'ok',kind:'primary',label:B('作废','Void')},{v:'cancel',label:B('取消','Cancel')}]}).then(function(r){
    if(r.v!=='ok')return;
    e.hist.push(histOf(e,'void'));e.void=true;e.voidWhy=r.text.slice(0,200);e.voidAt=Date.now();e.rev++;e.saved=Date.now();
    persistSes();suggest(sd.id);saveSd();sesSyncForm();sesRender();safeRender();parRender();
    toast(B('已作废（可在表格里恢复，或永久删除）。','Voided (restore it, or delete it permanently, in the table).'));
  });
}
function sesRestore(k){
  var e=sesFind(k);if(!e)return;
  e.hist.push(histOf(e,'restore'));e.void=false;e.voidWhy='';e.voidAt=0;e.rev++;e.saved=Date.now();
  persistSes();sesRender();safeRender();parRender();toast(B('已恢复。','Restored.'));
}
function erase(list,why){
  /* permanent: gone from the live data and from every restore point */
  var keys={};list.forEach(function(e){keys[sesKeyOf(e)]=1});
  sessions=sessions.filter(function(e){return !(e.void&&keys[sesKeyOf(e)])});
  var ok=persistSes(),ok2=purgeSnaps(function(e){return !!keys[sesKeyOf(e)]});
  suggest(sd.id);saveSd();sesSyncForm();sesRender();safeRender();parRender();
  toast(ok&&ok2?B('已永久删除 '+list.length+' 条。','Permanently deleted '+list.length+'.'):B('<b>删除后没能写入存储！</b>请保存完整备份并检查。','<b>Could not write the deletion to storage!</b> Save a full backup and check.'));
}
function sesPurge(k){
  var e=sesFind(k);if(!e||!e.void)return;
  ask({title:B('永久删除这条记录？','Delete this entry permanently?'),
    body:'<p><b class="mono">'+esc(e.id)+' · '+e.n+' · '+esc(lb(WHEN[e.when].zh,WHEN[e.when].en))+'</b></p><p class="note">'+B('这条已作废的记录会被彻底删除：数值、修改历史、作废原因都不再保留，也会从“恢复点”里清除。<b>此操作不能撤销。</b>以前保存过的备份文件里的副本不受影响，需要你自己处理。','This voided entry is erased for good: the value, its history and the void reason are not kept, and it is removed from the restore points too. <b>This cannot be undone.</b> Copies inside backup files you saved earlier are not touched; deal with those yourself.')+'</p>',
    buttons:[{v:'ok',kind:'danger',label:B('永久删除','Delete permanently')},{v:'cancel',kind:'primary',label:B('取消','Cancel')}]}).then(function(r){
    if(r.v==='ok')erase([e]);
  });
}
function sesPurgeAll(){
  var vs=sessions.filter(function(e){return e.void});if(!vs.length)return;
  ask({title:B('永久删除全部已作废的记录？','Delete all voided entries permanently?'),
    body:'<p><b class="mono">'+vs.length+'</b> '+B('条已作废的治疗 VAS','voided session VAS entries')+'</p><p class="note">'+B('它们会被彻底删除，也会从“恢复点”里清除。<b>此操作不能撤销。</b>有效记录不受影响。','They are erased for good and removed from the restore points. <b>This cannot be undone.</b> Active entries are not affected.')+'</p>',
    buttons:[{v:'ok',kind:'danger',label:B('全部永久删除','Delete all permanently')},{v:'cancel',kind:'primary',label:B('取消','Cancel')}]}).then(function(r){
    if(r.v==='ok')erase(vs);
  });
}
function sesHist(k){
  var e=sesFind(k);if(!e)return;
  var whyL={overwrite:['被覆盖前','before overwrite'],void:['作废前','before void'],restore:['恢复前','before restore'],imported:['被导入替换前','before import replaced it']};
  var row=function(x,cur){
    var w=whyL[x.why]||['',''];
    return '<tr><td class="num">'+(x.rev|0)+'</td><td class="num">'+esc(x.saved?fmtDT(x.saved):'—')+'</td><td class="num"><b>'+(prefs.blind?'••':fmt(x.vas))+'</b></td><td>'+B(itemOf(x.item).zh,itemOf(x.item).en)+'</td><td>'+(cur?B('当前','current')+(e.void?' · '+B('作废','void'):''):B(w[0],w[1]))+'</td><td>'+esc(x.note||'')+'</td></tr>';
  };
  var rows=row(e,true)+e.hist.slice().reverse().map(function(x){return row(x,false)}).join('');
  var body='<div class="tablewrap"><table class="rec"><thead><tr>'+['版本|Rev','保存时间|Saved','VAS (mm)|VAS (mm)','提问|Question','状态|State','备注|Note'].map(function(s){var p=s.split('|');return '<th class="bi">'+B(p[0],p[1])+'</th>'}).join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'
    +(e.void&&e.voidWhy?'<p class="note">'+B('作废原因：'+esc(e.voidWhy),'Void reason: '+esc(e.voidWhy))+'</p>':'');
  ask({title:B('修改历史 · ','History · ')+esc(e.id)+' #'+e.n+' '+B(WHEN[e.when].zh,WHEN[e.when].en),body:body,buttons:[{v:'ok',kind:'primary',label:B('关闭','Close')}]});
}

/* ---------- backup, export, import, restore ---------- */
function hashStr(s){
  try{
    if(window.crypto&&crypto.subtle&&window.TextEncoder){
      return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('');
      });
    }
  }catch(e){}
  var h=2166136261,i;for(i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
  return Promise.resolve('fnv1a:'+('00000000'+h.toString(16)).slice(-8));
}
function buildBackup(){
  var data={records:records,sessions:sessions,participants:participants,rand:RL||null,mcgill:mcg};
  return hashStr(JSON.stringify(data)).then(function(h){
    return JSON.stringify({app:'odi-tsk-scorer',format:4,exported:new Date().toISOString(),counts:{records:records.length,sessions:sessions.length,mcgill:mcg.length,participants:participants.length,allocated:randCount()},sha256:h,data:data},null,1);
  });
}
function csvCell(x){var s=x===null||x===undefined?'':String(x);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function sesCSV(){
  sortSessions();
  var head=['id','group','session_no','when','vas_mm','question','site','date','recorded_at','source','note','status','void_reason','revisions'];
  var rows=sessions.map(function(e){return [e.id,armOf(e.id),e.n,e.when,e.vas,e.item,e.site,e.date,e.at?fmtDT(e.at):'',e.scr,e.note,e.void?'void':'active',e.voidWhy,e.rev]});
  return '﻿'+[head].concat(rows).map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
}
function markBackedUp(how){bak.at=Date.now();bak.chg=0;bak.how=how;LS.set(K_BAK,bak);paintBackup();safeRender()}
function fallbackCopy(text,kind){
  var box=$('#copyBox');
  var showBox=function(){go('rec');box.hidden=false;box.value=text;box.focus();box.select();toast(B('这里不能直接存文件。文本已选中，请复制后粘贴到备忘录或邮件里保存。','Files cannot be saved here. The text is selected: copy it and paste it into a note or an email to keep it.'))};
  try{navigator.clipboard.writeText(text).then(function(){
    box.hidden=true;if(kind==='backup')markBackedUp('copy');
    toast(B('这里不能直接存文件，已复制到剪贴板。请马上粘贴到备忘录、邮件或文档里保存。','Files cannot be saved here, so the text was copied to the clipboard. Paste it into a note, an email or a document and save it now.'));
  },showBox)}catch(e){showBox()}
}
function deliver(name,text,kind){
  if(!dlCap){fallbackCopy(text,kind);return}
  dlCap.save({filename:name,data:text}).then(function(){
    if(kind==='backup')markBackedUp('file');
    toast(B('已保存文件 '+esc(name)+'。请再复制一份到电脑或云盘，至少两个位置。','Saved the file '+esc(name)+'. Copy it to a computer or cloud drive too: at least two places.'));
  },function(err){
    if(err&&err.code==='declined'){toast(B('没有保存（已取消）。','Not saved (cancelled).'));return}
    fallbackCopy(text,kind);
  });
}

function parseBackup(text){
  var obj;try{obj=JSON.parse(text)}catch(e){return {err:1}}
  var recs,sess,pars=[],rl=null,mcgs=[],meta={exported:'',sum:null,dataStr:null};
  if(obj&&obj.app==='odi-tsk-raw'&&obj.keys&&typeof obj.keys==='object'){
    /* rescue dump: the raw browser-storage values, plus any text set aside as unreadable */
    var g=function(k){try{var v=JSON.parse(obj.keys[k]);return v}catch(e){return null}};
    var arr=function(base){var out=[],v=g(base);if(Array.isArray(v))out=out.concat(v);Object.keys(obj.keys).forEach(function(k){if(k.indexOf(base+':corrupt:')===0){var c=g(k);if(Array.isArray(c))out=out.concat(c)}});return out};

function mergePlan(p){

  Object.keys(ri).forEach(function(k){var r=ri[k],ex=find(k);if(!ex)P.rec.add.push(r);else if(r.saved>ex.saved)P.rec.upd.push(r);else if(r.saved===ex.saved)P.rec.same++;else P.rec.keep++});
  p.sess.forEach(function(raw){if(!sesValid(raw)){P.ses.bad++;return}var e=sesNorm(raw),k=sesKeyOf(e);if(!si[k]||e.saved>si[k].saved)si[k]=e});
  Object.keys(si).forEach(function(k){var e=si[k],ex=sesFind(k);if(!ex)P.ses.add.push(e);else if(e.saved>ex.saved)P.ses.upd.push(e);else if(e.saved===ex.saved)P.ses.same++;else P.ses.keep++});
  p.mcgs.forEach(function(raw){if(!mcgValid(raw)){P.mcg.bad++;return}var e=mcgNorm(raw),k=mcgKeyOf(e);if(!mi[k]||e.saved>mi[k].saved)mi[k]=e});
  Object.keys(mi).forEach(function(k){var e=mi[k],ex=mcgFind(k);if(!ex)P.mcg.add.push(e);else if(e.saved>ex.saved)P.mcg.upd.push(e);else if(e.saved===ex.saved)P.mcg.same++;else P.mcg.keep++});
  p.pars.forEach(function(raw){var x=parNorm(raw);if(!x){P.par.bad++;return}if(!pi[x.id]||(x.arm&&!pi[x.id].arm))pi[x.id]=x});
  var taken={};participants.forEach(function(q){if(q.ridx>=0)taken[q.ridx]=q.id});
  Object.keys(pi).forEach(function(id){
    var x=pi[id],ex=getPar(id),clash=x.ridx>=0&&taken[x.ridx]&&taken[x.ridx]!==id;
    if(!ex){if(clash){P.par.conf++;return}if(x.ridx>=0)taken[x.ridx]=id;P.par.add.push(x);return}
    if(ex.arm&&x.arm){if(ex.arm===x.arm)P.par.same++;else P.par.conf++;return}
    if(!ex.arm&&x.arm){if(clash){P.par.conf++;return}if(x.ridx>=0)taken[x.ridx]=id;P.par.upd.push(Object.assign({},x,{consent:ex.consent||x.consent,consentDate:ex.consentDate||x.consentDate}));return}
    if(!ex.consent&&x.consent){P.par.upd.push(Object.assign({},ex,{consent:true,consentDate:x.consentDate}));return}

    var rl=randNorm(p.rl);

function applyPlan(P){

  P.rec.add.concat(P.rec.upd).forEach(function(r){

  P.ses.upd.forEach(function(e){var ex=sesFind(sesKeyOf(e)),i=sessions.indexOf(ex);e.hist.push(histOf(ex,'imported'));sessions[i]=e});
  P.mcg.add.forEach(function(e){mcg.push(e)});
  P.mcg.upd.forEach(function(e){var ex=mcgFind(mcgKeyOf(e)),i=mcg.indexOf(ex);e.hist.push(mcgHistOf(ex,'imported'));mcg[i]=e});
  sortMcg();

  P.par.upd.forEach(function(x){var i=participants.indexOf(getPar(x.id));if(i>=0)participants[i]=x});

  bind('#vasSiteEn','input',function(e){prefs.vasSiteEn=e.target.value.slice(0,40);savePrefs();sesQ();vasReadout()});
