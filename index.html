  paintCorrupt();
}

/* ====================== McGill core endurance tests ====================== */
var MK=['flex','ext','rsb','lsb'];
var MTP=['baseline','w4','w12','post'];
var MT=[
 {k:'flex',zh:'躯干屈肌耐力',en:'Trunk flexor endurance',
  dz:'坐位，髋、膝各屈 90°，双臂交叉抱胸，背靠 60° 斜板。斜板向后撤约 10 cm 时开始计时。躯干姿势出现明显改变（肩部前圆、腰椎过伸，或背部碰到斜板）就停。',
  de:'Seated, hips and knees at 90°, arms folded across the chest, back against a 60° board. Start when the board is moved back about 10 cm. Stop when the trunk position clearly changes (shoulders rounding forward, the low back arching, or the back touching the board).'},
 {k:'ext',zh:'躯干伸肌耐力（Biering-Sørensen）',en:'Trunk extensor endurance (Biering-Sørensen)',
  dz:'俯卧，髂嵴与床沿齐平，下肢用带子固定，双臂交叉抱胸。躯干抬到与地面平行时开始计时；掉到水平以下或无法保持就停。',
  de:'Prone, iliac crests at the table edge, lower legs strapped, arms crossed over the chest. Start when the trunk is raised parallel to the floor; stop when it drops below horizontal or cannot be held.'},
 {k:'rsb',zh:'右侧桥（右肘在下）',en:'Right side bridge (right elbow down)',
  dz:'右侧卧，右肘在肩正下方，双腿伸直、双脚叠放，抬起髋部使身体成一直线时开始计时。髋部下沉或前后偏移就停。',
  de:'Lying on the right side, right elbow directly under the shoulder, legs extended with the feet stacked. Start when the hips are lifted and the body is in a straight line. Stop when the hips drop or shift forward or back.'},
 {k:'lsb',zh:'左侧桥（左肘在下）',en:'Left side bridge (left elbow down)',
  dz:'左侧卧，左肘在肩正下方，其余与右侧桥相同。',
  de:'Lying on the left side, left elbow directly under the shoulder; otherwise the same as the right side bridge.'}
];
function mtOf(k){for(var i=0;i<MT.length;i++)if(MT[i].k===k)return MT[i];return MT[0]}

/* ---------- loading ---------- */
function mcgTime(x){return typeof x==='number'&&isFinite(x)&&x>=0&&x<=3600?Math.round(x*10)/10:null}
function mcgValid(e){return !!(e&&typeof e.id==='string'&&e.id.trim()&&TP[e.tp]&&MK.some(function(k){return mcgTime(e[k])!==null}))}
function mcgNorm(e){
  var s=function(x,m){return typeof x==='string'?x.slice(0,m):''};
  var o={id:e.id.trim().toUpperCase(),tp:e.tp,date:s(e.date,10),at:+e.at||0,note:s(e.note,300),
    created:+e.created||+e.saved||0,saved:+e.saved||+e.created||0,rev:e.rev|0,
    hist:Array.isArray(e.hist)?e.hist.slice(-40):[],void:!!e.void,voidWhy:s(e.voidWhy,200),voidAt:+e.voidAt||0};
  MK.forEach(function(k){o[k]=mcgTime(e[k])});
  return o;
}
function loadMcg(){var a=LS.get(K_MCG);return Array.isArray(a)?a.filter(mcgValid).map(mcgNorm):[]}
var mcg=loadMcg();
function mcgKeyOf(e){return e.id+'|'+e.tp}
function mcgFind(k){for(var i=0;i<mcg.length;i++)if(mcgKeyOf(mcg[i])===k)return mcg[i];return null}
function mcgActive(){return mcg.filter(function(e){return !e.void})}
function sortMcg(){mcg.sort(function(a,b){return a.id.localeCompare(b.id,undefined,{numeric:true})||(TP_ORDER[a.tp]||0)-(TP_ORDER[b.tp]||0)})}
function persistMcg(){
  var ok=LS.set(K_MCG,mcg);
  var w=$('#mcgWarn');w.hidden=ok&&storageOK;
  if(!ok||!storageOK)w.innerHTML=B('保存失败：这个浏览器无法写入存储（可能是无痕模式或空间已满）。请立刻到“记录与备份”点“保存完整备份”，并保持本页打开。','Saving failed: this browser cannot write to storage (private mode or full). Open Records and press Save full backup right now, and keep this page open.');
  markChanged();
  return ok;
}
function purgeSnapsM(pred){
  try{
    var l=snapList();if(!l.length)return true;
    l.forEach(function(x){if(Array.isArray(x.m)){x.m=x.m.filter(function(e){return !pred(e)});x.nm=x.m.length}});
    return LS.set(K_SNAP,l);
  }catch(e){return false}
}

/* ---------- ratios and statistics ---------- */
function mcgR(e){
  var d=function(a,b){return a!==null&&b!==null&&b>0?a/b:null};
  return {fe:d(e.flex,e.ext),rl:d(e.rsb,e.lsb),re:d(e.rsb,e.ext),le:d(e.lsb,e.ext)};
}
function mcgR2(x){return x===null||x===undefined?'—':x.toFixed(2)}
/* McGill's reference values: flexion:extension < 1.0; right:left side bridge within 0.05 of 1.0; each side bridge:extension < 0.75 */
function refOk(kind,v){
  if(v===null)return null;
  if(kind==='fe')return v<1.0;
  if(kind==='rl')return Math.abs(v-1)<=0.05+1e-9;
  return v<0.75;
}
function mcgMean(a){return a.reduce(function(s,x){return s+x},0)/a.length}
function mcgSd(a){if(a.length<2)return null;var m=mcgMean(a);return Math.sqrt(a.reduce(function(s,x){return s+(x-m)*(x-m)},0)/(a.length-1))}
function mcgCol(l,f){var v=l.map(f).filter(function(x){return x!==null&&isFinite(x)});return {n:v.length,m:v.length?mcgMean(v):null,s:mcgSd(v)}}
function mcgStatData(){
  var act=mcgActive(),out={desc:[],rat:[],chg:[]},arms={},ung=false;
  act.forEach(function(e){var a=armOf(e.id);if(a)arms[a]=1;else ung=true});
  var ak=Object.keys(arms).sort();
  var grp=[['all','全部','All',function(){return true}]];
  if(ak.length){
    ak.forEach(function(a){grp.push([a,a+' 组','Group '+a,function(e){return armOf(e.id)===a}])});
    if(ung)grp.push(['-','未分组','No group',function(e){return !armOf(e.id)}]);
  }
  var base={};act.forEach(function(e){if(e.tp==='baseline')base[e.id]=e});
  MTP.forEach(function(tp){
    var L=act.filter(function(e){return e.tp===tp});if(!L.length)return;
    grp.forEach(function(g){
      var l=L.filter(g[3]);if(!l.length)return;
      out.desc.push({tp:tp,g:g,n:l.length,c:MK.map(function(k){return mcgCol(l,function(e){return e[k]})})});
      out.rat.push({tp:tp,g:g,n:l.length,c:['fe','rl','re','le'].map(function(r){return mcgCol(l,function(e){return mcgR(e)[r]})})});
    });
    if(tp==='baseline')return;
    var Pp=L.filter(function(e){return base[e.id]});
    grp.forEach(function(g){
      var l=Pp.filter(g[3]);if(!l.length)return;
      out.chg.push({tp:tp,g:g,n:l.length,c:MK.map(function(k){return mcgCol(l,function(e){var b=base[e.id][k];return e[k]===null||b===null?null:e[k]-b})})});
    });
  });
  return out;
}
function statCell(c,dp,signed,rown){
  if(!c.n)return '—';
  var t=(signed&&c.m>0?'+':'')+c.m.toFixed(dp);
  if(c.s!==null)t+=' ± '+c.s.toFixed(dp);
  if(c.n!==rown)t+=' (n='+c.n+')';
  return t;
}
var MSTAT_SEC=[
 {key:'desc',dp:1,signed:false,zh:'四项测试的保持时间（秒，均值 ± 标准差）',en:'Hold times of the four tests (s, mean ± SD)',
  heads:[['屈肌','Flexor'],['伸肌','Extensor'],['右侧桥','R side bridge'],['左侧桥','L side bridge']]},
 {key:'rat',dp:2,signed:false,zh:'McGill 比值（均值 ± 标准差）',en:'McGill ratios (mean ± SD)',
  heads:[['屈/伸','Flexor : ext.'],['右/左侧桥','R : L bridge'],['右侧桥/伸','R bridge : ext.'],['左侧桥/伸','L bridge : ext.']]},
 {key:'chg',dp:1,signed:true,zh:'较基线的变化（秒，同一人前后配对，均值 ± 标准差）',en:'Change from baseline (s, paired within person, mean ± SD)',
  heads:[['屈肌','Flexor'],['伸肌','Extensor'],['右侧桥','R side bridge'],['左侧桥','L side bridge']]}
];
function mcgStatsHTML(){
  var D=mcgStatData();
  if(!D.desc.length)return '<p class="note bi">'+B('还没有有效的 McGill 记录。保存几条之后，这里会按时间点和分组自动统计。','No active McGill entries yet. After you save some, statistics by timepoint and group appear here.')+'</p>';
  var h='';
  MSTAT_SEC.forEach(function(sec){
    var rows=D[sec.key];if(!rows.length)return;
    h+='<p class="stat-h"><b class="bi">'+B(sec.zh,sec.en)+'</b></p><div class="tablewrap" style="margin-bottom:14px"><table class="rec stat"><thead><tr><th class="bi">'+B('时间点','Timepoint')+'</th><th class="bi">'+B('组','Group')+'</th><th class="bi">n</th>'
     +sec.heads.map(function(x){return '<th class="bi">'+B(x[0],x[1])+'</th>'}).join('')+'</tr></thead><tbody>'
     +rows.map(function(r){return '<tr><td><span class="bi-i">'+B(TP[r.tp].zh,TP[r.tp].en)+'</span></td><td><span class="bi-i">'+B(r.g[1],r.g[2])+'</span></td><td class="num">'+r.n+'</td>'
       +r.c.map(function(c){return '<td class="num">'+esc(statCell(c,sec.dp,sec.signed,r.n))+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';
  });
  return h+'<p class="note bi">'+B('只统计未作废的记录；标准差是样本标准差（n−1），n<2 时不显示；某项测试有缺失时在括号里标出实际人数。这里只描述数据，不做假设检验，请按研究方案另行分析。','Only entries that are not voided are counted. SD is the sample SD (n−1) and is left out when n<2; where a test is missing, the actual n is shown in brackets. This is descriptive only, with no hypothesis tests; analyse as your protocol specifies.')+'</p>';
}
function mcgStatsTSV(){
  var D=mcgStatData(),out=[];
  MSTAT_SEC.forEach(function(sec){
    var rows=D[sec.key];if(!rows.length)return;
    out.push([sec.zh].join('\t'));
    out.push(['时间点','组','n'].concat(sec.heads.map(function(x){return x[0]+'_mean'}),sec.heads.map(function(x){return x[0]+'_SD'}),sec.heads.map(function(x){return x[0]+'_n'})).join('\t'));
    rows.forEach(function(r){
      out.push([TP[r.tp].zh,r.g[1],r.n].concat(
        r.c.map(function(c){return c.n?(Math.round(c.m*1000)/1000):''}),
        r.c.map(function(c){return c.s===null?'':(Math.round(c.s*1000)/1000)}),
        r.c.map(function(c){return c.n})).join('\t'));
    });
    out.push('');
  });
  return out.join('\n');
}

/* ---------- form state ---------- */
var md={id:'',tp:'baseline',date:today(),note:'',flex:'',ext:'',rsb:'',lsb:''};
var mcgFilterV='all';
var mw={k:null,t0:0,timer:0,lock:null};
function nowMs(){try{return performance.now()}catch(e){return Date.now()}}
function fmtT(sec){
  if(sec===null||sec===undefined||!isFinite(sec))return '—';
  var t=Math.round(sec*10),m=Math.floor(t/600),r=t%600;
  return m+':'+pad2(Math.floor(r/10))+'.'+(r%10);
}
function mcgKey(){return md.id+'|'+md.tp}
function mcgSuggest(id){
  var have={};mcgActive().forEach(function(e){if(e.id===id)have[e.tp]=1});
  md.tp=['baseline','w4','w12'].filter(function(t){return !have[t]})[0]||'baseline';
}
function mcgAbort(){
  if(!mw.k&&!mw.timer)return;
  clearInterval(mw.timer);mw.timer=0;mw.k=null;
  try{if(mw.lock){mw.lock.release();mw.lock=null}}catch(e){}
}
function mcgClearVals(){mcgAbort();md.note='';MK.forEach(function(k){md[k]=''})}
function mcgResetForm(){mcgClearVals();md.id='';md.tp='baseline';md.date=today();if($('#mId'))mcgSyncForm()}

/* ---------- stopwatch ---------- */
function mcgShow(k){
  var el=$('#mt-'+k);if(!el)return;
  if(mw.k===k)el.textContent=fmtT((nowMs()-mw.t0)/1000);
  else{var v=parseFloat(md[k]);el.textContent=isFinite(v)?fmtT(v):'—'}
}
function mcgTick(){if(mw.k)mcgShow(mw.k)}
function mcgPaintTests(){
  MT.forEach(function(t){
    var b=$('#mgo-'+t.k);if(!b)return;
    var run=mw.k===t.k,has=md[t.k]!==''&&md[t.k]!==undefined&&md[t.k]!==null;
    if(!b.dataset.armed){
      b.innerHTML='<span class="bi-i">'+(run?B('停止','Stop'):has?B('重新计时','Restart'):B('开始','Start'))+'</span>';
      b.classList.toggle('primary',!has||run);
      if(has&&!run)b.setAttribute('data-confirm','1');else b.removeAttribute('data-confirm');
    }
    var box=b.closest('.mt');if(box)box.classList.toggle('run',run);
    $('#m-'+t.k).disabled=run;
    mcgShow(t.k);
  });
}
function mcgStart(k){
  md[k]='';$('#m-'+k).value='';
  mw.k=k;mw.t0=nowMs();
  clearInterval(mw.timer);mw.timer=setInterval(mcgTick,100);
  try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request('screen').then(function(l){if(mw.k)mw.lock=l;else{try{l.release()}catch(e){}}},function(){})}catch(e){}
  mcgPaintTests();
}
function mcgStop(){
  if(!mw.k)return;
  var k=mw.k,sec=Math.min(3600,Math.round((nowMs()-mw.t0)/100)/10);
  mcgAbort();
  md[k]=String(sec);$('#m-'+k).value=sec;
  mcgPaintTests();
}
actions.mGo=function(el){
  var k=el.dataset.v;
  if(mw.k===k){mcgStop();return}
  if(mw.k){toast(B('请先停止正在计时的那一项。','Stop the running test first.'));return}
  mcgStart(k);
};
actions.mReset=function(el){
  var k=el.dataset.v;
  if(mw.k===k)mcgAbort();
  md[k]='';$('#m-'+k).value='';mcgPaintTests();
};

/* ---------- form ---------- */
function mcgNote(){
  var el=$('#mNote'),ex=md.id?mcgFind(mcgKey()):null,h='';
  if(ex){
    h='<span class="warn bi-i">'+B('这位受试者“'+esc(TP[md.tp].zh)+'”的 McGill 已经记录过（'+esc(fmtDT(ex.saved))+(ex.void?'，已作废':'')+'）。再次保存会覆盖，旧值留在历史里。','This participant’s McGill for “'+esc(TP[md.tp].en)+'” is already recorded ('+esc(fmtDT(ex.saved))+(ex.void?', voided':'')+'). Saving again overwrites it; the old values stay in its history.')+'</span> '
     +'<button type="button" class="btn small" data-act="mLoad" data-v="'+esc(mcgKey())+'"><span class="bi-i">'+B('载入','Load it')+'</span></button>';
  }
  el.innerHTML=h;
}
function mcgSyncForm(){
  var sel=$('#mId');if(!sel)return;
  var ids=allIds();
  sel.innerHTML='<option value="">'+esc(lb('— 选择受试者 —','— choose a participant —'))+'</option>'+ids.map(function(id){var a=armOf(id);return '<option value="'+esc(id)+'">'+esc(id+(a?' · '+armTxt(a):''))+'</option>'}).join('');
  sel.value=ids.indexOf(md.id)>=0?md.id:'';
  if(sel.value!==md.id)md.id=sel.value;
  var tps=['baseline','w4','w12'];if(tps.indexOf(md.tp)<0)tps.push(md.tp);
  $('#mTp').innerHTML=tps.map(function(t){return '<option value="'+t+'">'+esc(lb(TP[t].zh,TP[t].en))+'</option>'}).join('');
  $('#mTp').value=md.tp;
  $('#mDate').value=md.date;$('#mNoteTxt').value=md.note;
  MK.forEach(function(k){$('#m-'+k).value=md[k]});
  mcgNote();mcgPaintTests();
}
function mcgHistOf(e,why){return {flex:e.flex,ext:e.ext,rsb:e.rsb,lsb:e.lsb,date:e.date,at:e.at,note:e.note,rev:e.rev,saved:e.saved,void:e.void,why:why}}
function mcgTimes(e){
  return MK.map(function(k){return B(mtOf(k).zh.replace(/（.*$/,''),mtOf(k).en.replace(/ \(.*$/,''))+' '+(e[k]===null?'—':e[k].toFixed(1)+' s')}).join(' · ');
}
function mcgSave(){
  if(mw.k){toast(B('还在计时，请先点“停止”。','A test is still running. Press Stop first.'));return}
  var vals={},any=false,bad=false,big=false;
  MK.forEach(function(k){
    var raw=String(md[k]===undefined?'':md[k]).trim();
    if(raw===''){vals[k]=null;return}
    var v=parseFloat(raw);
    if(!(isFinite(v)&&v>=0&&v<=3600)){bad=true;return}
    vals[k]=Math.round(v*10)/10;any=true;if(v>600)big=true;
  });
  var err=null;
  if(!md.id)err=B('请先选择受试者。','Choose a participant first.');
  else if(!md.date)err=B('请填写日期。','Enter a date.');
  else if(bad)err=B('时间应在 0–3600 秒之间。','Times must be between 0 and 3600 s.');
  else if(!any)err=B('四项测试都还没有时间：请计时或输入秒数。','No time yet for any test: time one or type the seconds in.');
  if(err){toast(err);return}
  var ex0=mcgFind(mcgKey()),chain=Promise.resolve(true);
  if(big)chain=chain.then(function(){
    return ask({title:B('有时间超过 10 分钟','A time is over 10 minutes'),body:'<p class="note">'+B('请核对是不是多打了一位数。','Check that it is not a typing slip.')+'</p>',
      buttons:[{v:'ok',kind:'primary',label:B('没错，继续','It is right, continue')},{v:'cancel',label:B('返回修改','Go back')}]}).then(function(r){return r.v==='ok'});
  });
  if(ex0)chain=chain.then(function(ok){
    if(!ok)return false;
    return ask({title:B('覆盖已有的记录？','Overwrite the existing entry?'),
      body:'<p class="note">'+B('编号 '+esc(md.id)+'，'+esc(TP[md.tp].zh)+'，已经有一条（'+esc(fmtDT(ex0.saved))+(ex0.void?'，已作废':'')+'）：','ID '+esc(md.id)+', '+esc(TP[md.tp].en)+', already has an entry ('+esc(fmtDT(ex0.saved))+(ex0.void?', voided':'')+'): ')+'</p><p class="note">'+mcgTimes(ex0)+'</p><p class="note">'+B('覆盖后旧值会保留在这条记录的“历史”里，不会丢失。','If you overwrite, the old values are kept in this entry’s History.')+'</p>',
      buttons:[{v:'ok',kind:'primary',label:B('覆盖','Overwrite')},{v:'cancel',label:B('取消','Cancel')}]}).then(function(r){return r.v==='ok'});
  });
  chain.then(function(ok){
    if(!ok)return;
    var now=Date.now(),ex=mcgFind(mcgKey());
    var f={date:md.date,at:now,note:md.note};MK.forEach(function(k){f[k]=vals[k]});
    if(ex){ex.hist.push(mcgHistOf(ex,'overwrite'));Object.assign(ex,f);ex.rev++;ex.saved=now;ex.void=false;ex.voidWhy='';ex.voidAt=0}
    else mcg.push(Object.assign({id:md.id,tp:md.tp,created:now,saved:now,rev:0,hist:[],void:false,voidWhy:'',voidAt:0},f));
    sortMcg();
    var stored=persistMcg();
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    var id=md.id,tp=md.tp;
    mcgClearVals();md.date=today();mcgSuggest(id);mcgFilterV=id;
    mcgSyncForm();mcgRender();safeRender();parRender();
    toast(stored?B('已保存：'+esc(id)+' · '+esc(TP[tp].zh)+(ex?'（已覆盖）':'')+'。','Saved: '+esc(id)+' · '+esc(TP[tp].en)+(ex?' (overwritten)':'')+'.')
      :B('<b>没有写入浏览器存储！</b>请立刻保存完整备份。','<b>Not written to browser storage!</b> Save a full backup right now.'));
  });
}
function mcgLoad(k){
  var e=mcgFind(k);if(!e)return;
  mcgAbort();
  md.id=e.id;md.tp=e.tp;md.date=e.date||today();md.note=e.note;
  MK.forEach(function(q){md[q]=e[q]===null?'':String(e[q])});
  mcgFilterV=e.id;mcgSyncForm();mcgRender();
  toast(B('已载入 '+esc(e.id)+' · '+esc(TP[e.tp].zh)+'。改动后保存，就是修改。','Loaded '+esc(e.id)+' · '+esc(TP[e.tp].en)+'. Change it and save to edit.'));
  window.scrollTo({top:$('#mForm').getBoundingClientRect().top+window.pageYOffset-70,behavior:'smooth'});
}

/* ---------- table ---------- */
function mcgRowHTML(e){
  var k=mcgKeyOf(e),a=armOf(e.id),tags='';
  if(e.rev>0)tags+=' <span class="tag">'+B('改×'+e.rev,'edited ×'+e.rev)+'</span>';
  if(e.void)tags+=' <span class="tag warn">'+B('作废','void')+'</span>';
  if(e.note)tags+=' <span class="tag">'+B('备注','note')+'</span>';
  var btn=function(act,zh,en,kind){return '<button type="button" class="btn small'+(kind?' '+kind:'')+'" data-act="'+act+'" data-v="'+esc(k)+'"><span class="bi-i">'+B(zh,en)+'</span></button>'};
  var acts=e.void
    ?btn('mRestore','恢复','Restore')+btn('mPurge','永久删除','Delete permanently','danger')+btn('mHist','历史','History')
    :btn('mLoad','载入','Load')+btn('mVoid','作废','Void')+(e.hist.length?btn('mHist','历史','History'):'');
  var R=mcgR(e);
  var tc=function(q){return '<td class="num">'+(e[q]===null?'<span class="mut">—</span>':e[q].toFixed(1))+'</td>'};
  var rc=function(kind,v){return '<td class="num'+(refOk(kind,v)===false?' flag':'')+'">'+mcgR2(v)+'</td>'};
  var sb='<td class="num'+((refOk('re',R.re)===false||refOk('le',R.le)===false)?' flag':'')+'">'+mcgR2(R.re)+' / '+mcgR2(R.le)+'</td>';
  return '<tr class="'+(e.void?'void':'')+'" title="'+esc(e.note||'')+'"><td class="num">'+esc(e.id)+'</td><td>'+(a?'<span class="armtag">'+esc(a)+'</span>':'<span class="mut">—</span>')+'</td>'
   +'<td><span class="bi-i">'+B(TP[e.tp].zh,TP[e.tp].en)+'</span>'+tags+'</td>'+tc('flex')+tc('ext')+tc('rsb')+tc('lsb')+rc('fe',R.fe)+rc('rl',R.rl)+sb+'<td class="act">'+acts+'</td></tr>';
}
function mcgRender(){
  var sel=$('#mFilter');if(!sel)return;
  var ids=allIds().filter(function(id){return mcg.some(function(e){return e.id===id})});
  if(mcgFilterV!=='all'&&ids.indexOf(mcgFilterV)<0)mcgFilterV='all';
  sel.innerHTML='<option value="all">'+esc(lb('全部受试者','All participants'))+'</option>'+ids.map(function(id){return '<option value="'+esc(id)+'">'+esc(id)+'</option>'}).join('');
  sel.value=mcgFilterV;
  sortMcg();
  var heads=[['编号','ID'],['分组','Group'],['时间点','Timepoint'],['屈肌 (s)','Flexor (s)'],['伸肌 (s)','Extensor (s)'],['右侧桥 (s)','R bridge (s)'],['左侧桥 (s)','L bridge (s)'],['屈/伸','Flex : ext'],['右/左','R : L'],['侧桥/伸 右 / 左','Bridge : ext R / L'],['','']];
  var th='<thead><tr>'+heads.map(function(h){return '<th class="bi">'+(h[0]?B(h[0],h[1]):'')+'</th>'}).join('')+'</tr></thead>';
  var rows=mcg.filter(function(e){return mcgFilterV==='all'||e.id===mcgFilterV}).map(mcgRowHTML).join('');
  if(!rows)rows='<tr><td class="empty bi" colspan="11">'+B('还没有 McGill 记录。选择受试者、计时或输入秒数，点“保存这次测试”后，这里会出现一行。','No McGill entries yet. Choose a participant, time the tests or type the seconds, and press Save; a row appears here.')+'</td></tr>';
  $('#mTable').innerHTML=th+'<tbody>'+rows+'</tbody>';
  var act=mcgActive().length,voids=mcg.length-act;
  $('#mFoot').innerHTML=B('共 '+act+' 条有效记录'+(voids?'，另有 '+voids+' 条已作废。作废只是打上标记，数据仍保留；要彻底删掉，请在作废的那一行点“永久删除”。':'。')+' 红色比值表示超出 McGill 的参考范围，只作提示。','Total '+act+' active entries'+(voids?', plus '+voids+' voided. Voiding only flags an entry and keeps the data; to erase it for good, press Delete permanently on the voided row.':'.')+' A red ratio is outside McGill’s reference range; it is only a flag.');
  $('#mPurgeAll').hidden=!voids;
  $('#c-mcg').textContent=act;
  $('#mStats').innerHTML=mcgStatsHTML();
  paintBackup();
}
function mcgOnShow(){mcgSyncForm();mcgRender()}

/* ---------- void, restore, permanent delete, history ---------- */
function mcgVoid(k){
  var e=mcgFind(k);if(!e)return;
  ask({title:B('作废这条记录？','Void this entry?'),
    body:'<p class="note">'+B('作废不会删除数据：这条仍保留在备份和导出里，只是带上“作废”标记，随时可以恢复。作废之后，如果确定不要了，可以在表里点“永久删除”。','Voiding does not delete anything. The entry stays in backups and exports flagged as void, and can be restored at any time. Once voided you can erase it for good with Delete permanently in the table.')+'</p><p><b class="mono">'+esc(e.id)+' · '+esc(lb(TP[e.tp].zh,TP[e.tp].en))+'</b></p>',
    input:{label:B('原因（可不填，例如：计时失误、重复）','Reason (optional, e.g. timing slip, duplicate)')},
    buttons:[{v:'ok',kind:'primary',label:B('作废','Void')},{v:'cancel',label:B('取消','Cancel')}]}).then(function(r){
    if(r.v!=='ok')return;
    e.hist.push(mcgHistOf(e,'void'));e.void=true;e.voidWhy=r.text.slice(0,200);e.voidAt=Date.now();e.rev++;e.saved=Date.now();
    persistMcg();mcgSyncForm();mcgRender();safeRender();parRender();
    toast(B('已作废（可在表格里恢复，或永久删除）。','Voided (restore it, or delete it permanently, in the table).'));
  });
}
function mcgRestore(k){
  var e=mcgFind(k);if(!e)return;
  e.hist.push(mcgHistOf(e,'restore'));e.void=false;e.voidWhy='';e.voidAt=0;e.rev++;e.saved=Date.now();
  persistMcg();mcgSyncForm();mcgRender();safeRender();parRender();toast(B('已恢复。','Restored.'));
}
function mcgErase(list){
  var keys={};list.forEach(function(e){keys[mcgKeyOf(e)]=1});
  mcg=mcg.filter(function(e){return !(e.void&&keys[mcgKeyOf(e)])});
  var ok=persistMcg(),ok2=purgeSnapsM(function(e){return !!keys[mcgKeyOf(e)]});
  mcgSyncForm();mcgRender();safeRender();parRender();
  toast(ok&&ok2?B('已永久删除 '+list.length+' 条。','Permanently deleted '+list.length+'.'):B('<b>删除后没能写入存储！</b>请保存完整备份并检查。','<b>Could not write the deletion to storage!</b> Save a full backup and check.'));
}
function mcgPurge(k){
  var e=mcgFind(k);if(!e||!e.void)return;
  ask({title:B('永久删除这条记录？','Delete this entry permanently?'),
    body:'<p><b class="mono">'+esc(e.id)+' · '+esc(lb(TP[e.tp].zh,TP[e.tp].en))+'</b></p><p class="note">'+B('这条已作废的记录会被彻底删除：数值、修改历史、作废原因都不再保留，也会从“恢复点”里清除。<b>此操作不能撤销。</b>以前保存过的备份文件里的副本不受影响，需要你自己处理。','This voided entry is erased for good: the values, its history and the void reason are not kept, and it is removed from the restore points too. <b>This cannot be undone.</b> Copies inside backup files you saved earlier are not touched; deal with those yourself.')+'</p>',
    buttons:[{v:'ok',kind:'danger',label:B('永久删除','Delete permanently')},{v:'cancel',kind:'primary',label:B('取消','Cancel')}]}).then(function(r){
    if(r.v==='ok')mcgErase([e]);
  });
}
function mcgPurgeAll(){
  var vs=mcg.filter(function(e){return e.void});if(!vs.length)return;
  ask({title:B('永久删除全部已作废的记录？','Delete all voided entries permanently?'),
    body:'<p><b class="mono">'+vs.length+'</b> '+B('条已作废的 McGill 记录','voided McGill entries')+'</p><p class="note">'+B('它们会被彻底删除，也会从“恢复点”里清除。<b>此操作不能撤销。</b>有效记录不受影响。','They are erased for good and removed from the restore points. <b>This cannot be undone.</b> Active entries are not affected.')+'</p>',
    buttons:[{v:'ok',kind:'danger',label:B('全部永久删除','Delete all permanently')},{v:'cancel',kind:'primary',label:B('取消','Cancel')}]}).then(function(r){
    if(r.v==='ok')mcgErase(vs);
  });
}
function mcgHist(k){
  var e=mcgFind(k);if(!e)return;
  var whyL={overwrite:['被覆盖前','before overwrite'],void:['作废前','before void'],restore:['恢复前','before restore'],imported:['被导入替换前','before import replaced it']};
  var t1=function(v){return v===null||v===undefined?'—':Number(v).toFixed(1)};
  var row=function(x,cur){
    var w=whyL[x.why]||['',''];
    return '<tr><td class="num">'+(x.rev|0)+'</td><td class="num">'+esc(x.saved?fmtDT(x.saved):'—')+'</td><td class="num">'+t1(x.flex)+'</td><td class="num">'+t1(x.ext)+'</td><td class="num">'+t1(x.rsb)+'</td><td class="num">'+t1(x.lsb)+'</td><td>'+(cur?B('当前','current')+(e.void?' · '+B('作废','void'):''):B(w[0],w[1]))+'</td><td>'+esc(x.note||'')+'</td></tr>';
  };
  var rows=row(e,true)+e.hist.slice().reverse().map(function(x){return row(x,false)}).join('');
  var body='<div class="tablewrap"><table class="rec"><thead><tr>'+['版本|Rev','保存时间|Saved','屈肌|Flexor','伸肌|Extensor','右侧桥|R bridge','左侧桥|L bridge','状态|State','备注|Note'].map(function(s){var p=s.split('|');return '<th class="bi">'+B(p[0],p[1])+'</th>'}).join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'
    +(e.void&&e.voidWhy?'<p class="note">'+B('作废原因：'+esc(e.voidWhy),'Void reason: '+esc(e.voidWhy))+'</p>':'');
  ask({title:B('修改历史 · ','History · ')+esc(e.id)+' '+B(TP[e.tp].zh,TP[e.tp].en),body:body,buttons:[{v:'ok',kind:'primary',label:B('关闭','Close')}]});
}

/* ---------- export ---------- */
function mcgCSV(){
  sortMcg();
  var head=['id','group','timepoint','date','recorded_at','flexor_s','extensor_s','right_side_bridge_s','left_side_bridge_s','flexor_extensor_ratio','right_left_side_bridge_ratio','right_side_bridge_extensor_ratio','left_side_bridge_extensor_ratio','note','status','void_reason','revisions'];
  var q=function(v){return v===null?'':Math.round(v*1000)/1000};
  var rows=mcg.map(function(e){var R=mcgR(e);return [e.id,armOf(e.id),e.tp,e.date,e.at?fmtDT(e.at):'',q(e.flex),q(e.ext),q(e.rsb),q(e.lsb),q(R.fe),q(R.rl),q(R.re),q(R.le),e.note,e.void?'void':'active',e.voidWhy,e.rev]});
  return '﻿'+[head].concat(rows).map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
}

/* ====================== patient mode: only the questionnaires remain ====================== */
function enterPt(){if(prefs.autoPt&&!prefs.blind)setBlind(true)}
function ptRoute(name){
  if(!prefs.blind)return name;
  if((name==='info'||name==='odi'||name==='tsk')&&state.id)return name;
  if(name==='ses'&&sd.id)return 'ses';
  return 'wait';
}
function setBlind(v){
  prefs.blind=!!v;savePrefs();
  $('#blind').checked=prefs.blind;
  document.documentElement.setAttribute('data-blind',prefs.blind?'1':'0');
  update();sesSyncForm();sesRender();parRender();vasSyncRuler();mcgRender();
  var cur=document.documentElement.getAttribute('data-tab')||'par';
  if(!prefs.blind&&cur==='wait')cur='par';
  go(cur);
  if(!prefs.blind&&pendingReveal){
    var pr=pendingReveal;pendingReveal=null;
    if(pr.rx)rxDialog(pr.id);
    else revealArm(pr.id,pr.res).then(function(){go('par');parRender()});
  }
}
function ptToggle(on){
  if(on){setBlind(true);return}
  ask({title:B('退出患者填写模式？','Leave Patient mode?'),
    body:'<p class="note">'+B('退出后会显示名单、分组和全部数据。请确认设备已经交还给工作人员。','Leaving shows the list, the groups and all the data. Make sure the device is back with staff.')+'</p>',
    buttons:[{v:'cancel',kind:'primary',label:B('继续患者模式','Stay in Patient mode')},{v:'ok',label:B('退出','Leave')}]}).then(function(r){
    if(r.v==='ok')setBlind(false);else $('#blind').checked=true;
  });

function ghSave(){try{localStorage.setItem(GH_K,JSON.stringify(GH))}catch(e){}}
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))))}
function ghReq(method,path,body,accept){
  var h={'Authorization':'Bearer '+GH.token,'Accept':accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(body)h['Content-Type']='application/json';
  var url='https://api.github.com/repos/'+encodeURIComponent(GH.owner)+'/'+encodeURIComponent(GH.repo)+path;
  return fetch(url,{method:method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'}).then(function(r){
    return r.text().then(function(t){var j=null;if(!accept){try{j=JSON.parse(t)}catch(e){}}return {s:r.status,j:j,t:t}});
  },function(){var x=new Error('network');x.code='network';throw x});
}
function ghErr(res){var x=new Error('http '+res.s);x.code=res.s===401?'token':res.s===403?'forbidden':res.s===404?'notfound':String(res.s);return x}
function ghErrText(c){
  return ({network:B('连不上 GitHub（网络不通，可能需要加速器）','cannot reach GitHub (network)'),token:B('令牌无效或已过期','the token is invalid or expired'),
    forbidden:B('令牌没有这个仓库的读写权限','the token has no read/write access to this repo'),notfound:B('找不到仓库：检查用户名、仓库名，以及令牌是否选了这个仓库','repo not found: check the owner, the repo name and the token’s repository access'),
    badfile:B('GitHub 上的数据文件读不出来','the data file on GitHub could not be read'),public:B('这个仓库是公开的','this repository is public')})[c]||('HTTP '+esc(String(c)));
}
function ghGetFile(path,ref){
  var q=ref?'?ref='+encodeURIComponent(ref):'';
  return ghReq('GET','/contents/'+path+q).then(function(res){
    if(res.s===404)return null;
    if(res.s!==200||!res.j)throw ghErr(res);
    var j=res.j;
    if(j.content&&j.encoding==='base64')return {sha:j.sha,text:b64d(j.content)};
    return ghReq('GET','/contents/'+path+q,null,'application/vnd.github.raw+json').then(function(r2){if(r2.s!==200)throw ghErr(r2);return {sha:j.sha,text:r2.t}});
  });
}
function ghCounts(){return participants.length+' 人 · 评估 '+records.length+' · VAS '+sessions.length+' · McGill '+mcg.length}
function ghDay(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function ghMerge(p){
  var P=mergePlan(p);
  var n=P.rec.add.length+P.rec.upd.length+P.ses.add.length+P.ses.upd.length+P.mcg.add.length+P.mcg.upd.length+P.par.add.length+P.par.upd.length+((P.rnd.act==='add'||P.rnd.act==='upd')?1:0);
  if(!n)return 0;
  var sn=snapshot;snapshot=function(){return sn('cloud')};
  try{applyPlan(P)}finally{snapshot=sn}
  return n;
}
function ghPull(){
  return ghGetFile(GH_FILE).then(function(f){
    CL.pullAt=Date.now();
    if(!f){CL.sha=null;CL.pulled=true;return 0}
    var p=parseBackup(f.text);
    if(p.err){var x=new Error('bad');x.code='badfile';throw x}
    CL.sha=f.sha;CL.pulled=true;
    return ghMerge(p);
  });
}
function ghCore(t){return t.replace(/"exported": ?"[^"]*",?/,'')}
function ghPush(tries){
  tries=tries||0;
  if(!ghOn()||!CL.pulled)return Promise.resolve(false);
  if(CL.busy){CL.again=true;return Promise.resolve(false)}
  CL.busy=true;CL.state='sync';clPaint();
  var text='';
  return buildBackup().then(function(t){
    text=t;
    var core=ghCore(t);
    if(CL.sha&&core===CL.last)return 'same';
    var body={message:'自动同步 '+fmtDT(Date.now())+' · '+ghCounts(),content:b64e(t)};
    if(CL.sha)body.sha=CL.sha;
    return ghReq('PUT','/contents/'+GH_FILE,body).then(function(res){
      if((res.s===200||res.s===201)&&res.j&&res.j.content){CL.sha=res.j.content.sha;CL.last=core;return 'ok'}
      if((res.s===409||res.s===422)&&tries<3)return 'conflict';
      throw ghErr(res);
    });
  }).then(function(r){
    CL.busy=false;
    if(r==='conflict')return ghPull().then(function(){return ghPush(tries+1)});
    CL.state='ok';CL.at=Date.now();CL.err='';CL.retry=0;GH.lastOk=CL.at;ghSave();clPaint();safeRender();
    ghDaily(text);
    if(CL.again){CL.again=false;clSchedule()}
    return true;
  }).catch(function(e){
    CL.busy=false;CL.state='err';CL.err=(e&&e.code)||'error';clPaint();
    clearTimeout(CL.timer);CL.timer=setTimeout(function(){ghPush()},Math.min(300000,15000*Math.pow(2,CL.retry++)));
    return false;
  });
}
function ghDaily(text){
  var d=ghDay();if(GH.day===d||!text)return;
  var path='data/daily/'+d+'.json';
  ghGetFile(path).then(function(f){
    if(f){GH.day=d;ghSave();return}
    return ghReq('PUT','/contents/'+path,{message:'每日备份 '+d+' · '+ghCounts(),content:b64e(text)}).then(function(res){if(res.s===200||res.s===201){GH.day=d;ghSave()}});
  }).catch(function(){});
}
function ghStart(){
  clearTimeout(CL.timer);
  if(!ghOn()){CL.state='off';clPaint();return}
  CL.state='sync';clPaint();
  ghPull().then(function(n){
    if(n)toast(B('已从 GitHub 合并 '+n+' 条数据。','Merged '+n+' entries from GitHub.'));
    return ghPush();
  },function(e){
    /* never push before a successful read: retry the read instead */
    CL.state='err';CL.err=(e&&e.code)||'error';clPaint();
    if(CL.err!=='token'&&CL.err!=='notfound'&&CL.err!=='forbidden'){CL.timer=setTimeout(ghStart,30000)}
  });
}
function clSchedule(){
  idbMirror();
  if(!ghOn())return;
  if(!CL.pulled){if(CL.state!=='sync'){clearTimeout(CL.timer);CL.timer=setTimeout(ghStart,3000)}return}
  clearTimeout(CL.timer);CL.timer=setTimeout(function(){ghPush()},2500);
}

    off:B('GitHub 未连接','GitHub not connected')}[CL.state]||'',cls=CL.state==='ok'?'ok':CL.state==='err'?'warn':'';

/* ---------- IndexedDB mirror of every odi-tsk: key ---------- */
var IDBM={timer:0};
function idbMirror(){
  clearTimeout(IDBM.timer);
  IDBM.timer=setTimeout(function(){
    if(window.__idbRestoring||!window.indexedDB)return;
    var o={},i,k;
    try{for(i=0;i<localStorage.length;i++){k=localStorage.key(i);if(k&&k.indexOf('odi-tsk:')===0&&k.indexOf(':corrupt:')<0&&k!=='odi-tsk:probe')o[k]=localStorage.getItem(k)}}catch(e){return}
    try{var r=indexedDB.open('odi-tsk-mirror',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('kv')};
      r.onsuccess=function(){try{var db=r.result,tx=db.transaction('kv','readwrite');tx.objectStore('kv').put({at:Date.now(),keys:o},'mirror');tx.oncomplete=function(){db.close()}}catch(e){}};
    }catch(e){}
  },800);
}

function splitLine(line,d){return d==='ws'?line.trim().split(/\s+/):line.split(d)}
function parseTable(text){
  var lines=text.replace(/^﻿/,'').split(/\r\n|\n|\r/),i,j,d,ci;
  var cands=[',','\t',';','ws'],best=',',bestScore=-1,bestN=1;
  for(ci=0;ci<cands.length;ci++){
    d=cands[ci];var counts={},seen=0;
    for(i=0;i<lines.length&&seen<300;i++){if(!lines[i].trim())continue;seen++;var cn=splitLine(lines[i],d).length;counts[cn]=(counts[cn]||0)+1}
    var topN=1,topF=0;
    for(var k in counts){if(counts[k]>topF||(counts[k]===topF&&+k>topN)){topF=counts[k];topN=+k}}
    var score=topN>1?topF*1000+topN:0;
    if(score>bestScore){bestScore=score;best=d;bestN=topN}
  }
  var nF=bestN,start=-1,f,ok,s;
  for(i=0;i<lines.length;i++){
    if(!lines[i].trim())continue;
    f=splitLine(lines[i],best);if(f.length!==nF)continue;
    ok=0;for(j=0;j<f.length;j++){s=f[j].trim();if(s!==''&&isFinite(+s))ok++}
    if(ok>=Math.max(1,Math.ceil(nF*0.8))){start=i;break}
  }
  if(start<0)return null;
  var names=null;
  for(i=start-1;i>=0&&i>=start-12;i--){
    if(!lines[i].trim())continue;
    f=splitLine(lines[i],best);
    if(f.length===nF){ok=0;for(j=0;j<f.length;j++){s=f[j].trim();if(s!==''&&isFinite(+s))ok++}
      if(ok<nF*0.5){names=f.map(function(x){return x.trim()});break}}
  }
  var cols=[];for(j=0;j<nF;j++)cols.push([]);
  var n=0,vals,anyNum,v;
  for(i=start;i<lines.length;i++){
    if(!lines[i].trim())continue;
    f=splitLine(lines[i],best);if(f.length!==nF)continue;
    anyNum=false;vals=new Array(nF);
    for(j=0;j<nF;j++){s=f[j].trim();v=s===''?NaN:+s;vals[j]=isFinite(v)?v:NaN;if(!isNaN(vals[j]))anyNum=true}
    if(!anyNum)continue;
    for(j=0;j<nF;j++)cols[j].push(vals[j]);
    n++;
  }
  var outNames=[],outCols=[];
  for(j=0;j<nF;j++){
    var has=false;for(i=0;i<n;i++){if(!isNaN(cols[j][i])){has=true;break}}
    if(has){outCols.push(Float64Array.from(cols[j]));outNames.push(names&&names[j]?names[j]:'Col '+(j+1))}
  }
  return {names:outNames,cols:outCols,n:n,delim:best};
}
function medianDt(t){
  var d=[],lim=Math.min(t.length-1,5000),i;
  for(i=0;i<lim;i++){var x=t[i+1]-t[i];if(x>0)d.push(x)}
  if(!d.length)return null;
  d.sort(function(a,b){return a-b});return d[d.length>>1];
}
function isTimeCol(c){
  var n=c.length,i,inc=0,lim=Math.min(n-1,2000);
  if(n<10)return false;
  for(i=0;i<lim;i++)if(c[i+1]>c[i])inc++;
  return inc>=lim*0.99;
}
function biquad(x,c){

function filt0(x,c){var y=biquad(x,c);y.reverse();y=biquad(y,c);y.reverse();return y}

function ampOf(x){

/* x: filtered signal; P: prefix of squares (raw) or values (envelope); e: 100 ms RMS envelope; Pe: prefix of e */
function processChannel(col,fs,cfg){
  var n=col.length,x=new Float64Array(n),i,last=0,mn=Infinity,v,raw=cfg.type==='raw';
  for(i=0;i<n;i++){v=col[i];if(isNaN(v))v=last;else last=v;x[i]=v;if(v<mn)mn=v}
  if(raw){
    var sum=0;for(i=0;i<n;i++)sum+=x[i];
    var mean=sum/n;for(i=0;i<n;i++)x[i]-=mean;
    if(cfg.hp&&fs>=200)x=filt0(x,hpCoef(fs,20));
    if(cfg.notch&&fs>=140)x=filt0(x,notchCoef(fs,50,30));
  }

/* finds the quiet valley (full-flexion hold) between two high-activity phases inside [i0,i1) */
function detectRelax(chs,fs,i0,i1){
  var step=Math.max(1,Math.round(fs/50)),sw=Math.max(2,Math.round(0.5*fs));
  var m=Math.floor((i1-i0)/step),k,c;
  if(m<10)return null;
  var s=new Float64Array(m);
  for(c=0;c<chs.length;c++){
    var arr=new Float64Array(m),mx=0;
    for(k=0;k<m;k++){
      var ctr=i0+k*step,a=Math.max(i0,ctr-(sw>>1)),b=Math.min(i1,ctr+(sw>>1)+1);
      if(b<=a)b=a+1;
      arr[k]=winStat(chs[c].P,a,b,chs[c].sq);if(arr[k]>mx)mx=arr[k];
    }
    if(mx<=0)continue;
    for(k=0;k<m;k++)s[k]+=arr[k]/mx/chs.length;
  }
  var L=new Float64Array(m),R=new Float64Array(m);
  L[0]=s[0];for(k=1;k<m;k++)L[k]=Math.max(L[k-1],s[k]);
  R[m-1]=s[m-1];for(k=m-2;k>=0;k--)R[k]=Math.max(R[k+1],s[k]);
  var gmax=L[m-1],bestK=-1,bestScore=Infinity;
  if(!(gmax>0))return null;
  for(k=0;k<m;k++){
    var pk=Math.min(L[k],R[k]);
    if(pk<0.25*gmax)continue;
    var sc=s[k]/pk;
    if(sc<bestScore){bestScore=sc;bestK=k}
  }
  if(bestK<0)return null;
  var vmin=s[bestK],pk2=Math.min(L[bestK],R[bestK]),thr=vmin+0.2*(pk2-vmin);
  var lo2=bestK,hi2=bestK;
  while(lo2>0&&s[lo2-1]<=thr)lo2--;
  while(hi2<m-1&&s[hi2+1]<=thr)hi2++;
  var rs=i0+lo2*step,re=i0+(hi2+1)*step;
  if(re-rs<0.5*fs){var mid=(rs+re)/2;rs=Math.round(mid-0.25*fs);re=Math.round(mid+0.25*fs)}
  rs=Math.max(i0,rs);re=Math.min(i1,re);
  return {rs:rs,re:re,score:bestScore};
}
/* best w-sample window inside [a,b) judged by the mean of the 100 ms RMS envelope */
function bestWin(Pe,a,b,w,wantMax){
  if(b-a<=0)return null;
  if(b-a<=w)return {v:(Pe[b]-Pe[a])/(b-a),s:a,e:b,short:b-a<w};
  var best=wantMax?-Infinity:Infinity,bs=a,s,m;
  for(s=a;s+w<=b;s++){m=(Pe[s+w]-Pe[s])/w;if(wantMax?m>best:m<best){best=m;bs=s}}
  return {v:best,s:bs,e:bs+w,short:false};
}
/* one cycle: flexion phase = [i0,rs), full-flexion rest = [rs,re] */
function frrCycle(ch,i0,rs,re,w){
  var f=rs-i0>=2?bestWin(ch.Pe,i0,rs,w,true):null;
  var r=re-rs>=2?bestWin(ch.Pe,rs,re,w,false):null;
  var num=f?f.v:null,den=r?r.v:null;
  return {num:num,den:den,frr:(num!==null&&den!==null&&den>0)?num/den:null,nw:f,dw:r,restShort:!!(r&&r.short)};
}
function sliceRanges(a,b,N){var o=[],i,len=(b-a)/N;for(i=0;i<N;i++)o.push([a+i*len,a+(i+1)*len]);return o}
function meanOf(arr){var s=0,n=0;arr.forEach(function(v){if(v!==null&&v!==undefined&&isFinite(v)){s+=v;n++}});return n?s/n:null}
/* 3 synthetic cycles in the 4-4-4-4 rhythm: stand, flex, hold, return */
function makeSample(){
  var fs=1000,CL=16,NC=3,n=fs*CL*NC,t=new Float64Array(n),L=new Float64Array(n),R=new Float64Array(n),i;
  var seed=20261014;
  function rnd(){seed=(seed+0x6D2B79F5)|0;var a=Math.imul(seed^(seed>>>15),1|seed);a=(a+Math.imul(a^(a>>>7),61|a))^a;return((a^(a>>>14))>>>0)/4294967296}
  function gauss(){var u=0;while(u===0)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd())}
  function hump(x){return x<=0||x>=1?0:Math.pow(Math.sin(Math.PI*x),1.3)}
  function base(u,r){var st=0.09;if(u<4)return st;if(u<8)return r+(st-r)*(8-u)/4;if(u<12)return r;if(u<16)return r+(st-r)*(u-12)/4;return st}
  var amp=[1,0.92,1.08],rel=[1,1.15,0.9];
  for(i=0;i<n;i++){
    var s=i/fs,c=Math.min(NC-1,Math.floor(s/CL)),u=s-c*CL;t[i]=s;
    var hum=0.01*Math.sin(2*Math.PI*50*s);
    var act=amp[c]*(0.25*hump((u-4)/4)+0.28*hump((u-12)/4));
    L[i]=(base(u,0.03*rel[c])+act)*gauss()+0.01*gauss()+hum;
    R[i]=(base(u,0.075*rel[c])+act)*gauss()+0.01*gauss()+hum;
  }
  return {names:['Time (s)','Erector spinae Left (mV)','Erector spinae Right (mV)'],cols:[t,L,R],n:n};
}

  emgInfo(B(esc(name)+'：读到 '+t.n+' 行、'+t.names.length+' 列。已按 4-4-4-4 节奏对齐，循环起点 '+r2(c.t0)+' 秒，共 '+c.N+' 次。请对照波形确认，含练习循环时请把起点后移。',esc(name)+': read '+t.n+' rows and '+t.names.length+' columns. Aligned to the 4-4-4-4 rhythm: cycle start '+r2(c.t0)+' s, '+c.N+' cycle(s). Check it against the waveform, and move the start later if the file includes a practice cycle.'));
  $('#emgAdoptNote').innerHTML='';
  emgRedraw();
}
function emgFromText(text,name){
  var t=null;try{t=parseTable(text)}catch(e){t=null}
  if(!t||t.n<50||!t.cols.length){emgInfo(B('没有读到足够的数字数据。请确认文件每行是一个采样点、每列是一个通道。','Not enough numeric data was found. Each row should be one sample and each column one channel.'));return}
  emgLoad(t,name,false,0);
}
function emgReadFile(f){
  var isX=/\.xlsx?$/i.test(f.name),rd=new FileReader();
  emgInfo(B('正在读取…','Reading…'));
  rd.onerror=function(){emgInfo(B('读取文件失败，请重试。','Could not read the file. Try again.'))};
  if(isX){
    rd.onload=function(){
      var go2=function(){
        try{var wb=window.XLSX.read(rd.result,{type:'array'});emgFromText(window.XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]],{FS:','}),f.name)}
        catch(e){emgInfo(B('无法解析这个 Excel 文件，请另存为 CSV 后再导入。','Could not parse this Excel file. Save it as CSV and import again.'))}
      };
      if(window.XLSX)go2();else loadScript(XLSX_SRC,go2,function(){emgInfo(B('无法加载 Excel 读取组件，请另存为 CSV 后再导入。','Could not load the Excel reader. Save the file as CSV and import again.'))});
    };
    rd.readAsArrayBuffer(f);
  }else{
    rd.onload=function(){emgFromText(String(rd.result),f.name)};
    rd.readAsText(f);
  }
}
function emgImage(){
  if(!emg.n)return;

  var W=760,H=80+32+nch*240+(nch-1)*12,cv=document.createElement('canvas');
  var tpn=TP[state.tp][prefs.lang==='en'?'en':'zh'];
  var title=(state.id||'—')+' · '+tpn+(state.date?' · '+state.date:'');
  var L=emg.mean.L,R=emg.mean.R,c=emg.cfg;
  var sub='FRR '+lang3('左','L')+' '+(L!==null&&L!==undefined?L.toFixed(2):'—')+'  '+lang3('右','R')+' '+(R!==null&&R!==undefined?R.toFixed(2):'—')+(c.N>1?'  ('+lang3(c.N+' 次平均',c.N+'-cycle mean')+')':'')+'   |   '+r2(emg.fs)+' Hz   |   '+lang3('窗口','window')+' '+c.W+' s';
  var sub2=lang3('黑条＝分子窗口（前屈最高）  蓝条＝分母窗口（静息最低）  阴影＝松弛段','Black bar = numerator window (flexion peak)  Blue bar = denominator window (quietest rest)  Shade = relaxation window');
  drawEMG(cv,W,H,palette(true),{handles:false,dpr:2,title:title,sub:sub,sub2:sub2});
  emgRedraw();
  var img=$('#emgImg');img.src=cv.toDataURL('image/png');$('#emgImgWrap').hidden=false;
  img.scrollIntoView({block:'nearest'});

/* canvas dragging: grabs the nearest handle of any cycle */
(function(){
  var cv=$('#emgCv'),pending=false;
  function tAt(e){var r=cv.getBoundingClientRect(),L=emg.layout;if(!L)return null;var x=e.clientX-r.left;return {x:x,t:(x-L.x0)/(L.x1-L.x0)*L.dur}}
  function hit(e){
    var p=tAt(e),L=emg.layout,best=null,bd=1e9;
    if(!p||emg.cfg.mode==='sched')return null;
    emg.cyc.forEach(function(cy,i){[cy.rs,cy.re].forEach(function(t,w){var x=L.x0+t/L.dur*(L.x1-L.x0),d=Math.abs(p.x-x);if(d<bd){bd=d;best={i:i,w:w}}})});
    return bd<=28?best:null;
  }
  cv.addEventListener('pointerdown',function(e){
    if(!emg.n)return;var h=hit(e);if(!h)return;
    emg.active=h.i;emg.drag=h;syncEmgInputs();
    try{cv.setPointerCapture(e.pointerId)}catch(x){}
    e.preventDefault();emgRedraw();
  });
  cv.addEventListener('pointermove',function(e){
    if(emg.drag===null){cv.style.cursor=emg.n&&hit(e)?'ew-resize':'default';return}
    var p=tAt(e);if(!p)return;
    var h=emg.drag,cy=emg.cyc[h.i],sl=slices()[h.i];
    if(h.w===0)cy.rs=Math.max(sl[0],Math.min(p.t,cy.re-0.05));else cy.re=Math.min(sl[1],Math.max(p.t,cy.rs+0.05));
    $('#emgRs').value=emg.cyc[emg.active].rs.toFixed(2);$('#emgRe').value=emg.cyc[emg.active].re.toFixed(2);
    if(!pending){pending=true;requestAnimationFrame(function(){pending=false;emgCompute()})}
  });
  function end(){emg.drag=null}
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
})();

[['#emgT0','t0',0,1e6],['#emgS','S',0,60],['#emgF','F',0.5,60],['#emgH','H',0.5,60],['#emgE','E',0,60],['#emgEdge','edge',0,10]].forEach(function(d){

actions.emgAdopt=function(){
  if(emg.synthetic)return;
  var c=emg.cfg,zh=[],en=[],mL=emg.mean.L,mR=emg.mean.R;
  if(mL!==null&&mL!==undefined){state.frrL=mL.toFixed(2);zh.push('左 '+state.frrL);en.push('Left '+state.frrL)}
  if(mR!==null&&mR!==undefined){state.frrR=mR.toFixed(2);zh.push('右 '+state.frrR);en.push('Right '+state.frrR)}
  if(!zh.length)return;
  var cyc=function(k){return (emg.res[k]||[]).map(function(r){return r&&r.frr!==null?r2(r.frr):null})};
  var nd=function(k,f){return (emg.res[k]||[]).map(function(r){var v=r?r[f]:null;return v!==null&&v!==undefined&&isFinite(v)?+v.toPrecision(4):null})};
  state.emgMeta={method:'peak-1s-flexion/min-1s-fullflexion-rest',mode:c.mode,rmsMs:100,fs:r2(emg.fs),type:c.type,hp:c.hp,notch:c.notch,wSec:c.W,cycles:c.N,
    sched:c.mode==='sched'?{t0:r2(c.t0),stand:c.S,flex:c.F,hold:c.H,ret:c.E,trim:r2(emg.schedEdge)}:null,
    rangeSec:[r2(c.a),r2(c.b)],relaxSec:emg.cyc.map(function(cy){return [r2(cy.rs),r2(cy.re)]}),frrL:cyc('L'),frrR:cyc('R'),
    numL:nd('L','num'),denL:nd('L','den'),numR:nd('R','num'),denR:nd('R','den'),at:Date.now()};
  fillInfo();update();
  $('#emgAdoptNote').innerHTML=B('已写入评估信息：'+zh.join('，')+(c.N>1?'（'+c.N+' 次平均）':'')+'。提交这位受试者的评估时会一并保存。','Written to the assessment: '+en.join(', ')+(c.N>1?' ('+c.N+'-cycle mean)':'')+'. It is saved when you submit this assessment.');
  toast(B('FRR 已写入评估信息。','FRR written to the assessment.'));
};

function drawQR(){

    try{
      var q=window.qrcode(0,'M');q.addData(url);q.make();
      var n=q.getModuleCount(),m=4,sz=n+2*m,p='',r,c;
      for(r=0;r<n;r++)for(c=0;c<n;c++)if(q.isDark(r,c))p+='M'+(c+m)+' '+(r+m)+'h1v1h-1z';
      box.innerHTML='<svg viewBox="0 0 '+sz+' '+sz+'" role="img" aria-label="QR code"><rect width="'+sz+'" height="'+sz+'" fill="#fff"/><path d="'+p+'" fill="#000"/></svg>';
    }catch(e){fail()}
  };
  if(window.qrcode)make();else{box.textContent='…';loadScript(QR_SRC,make,fail)}
